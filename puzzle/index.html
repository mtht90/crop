<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1d4f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ぷにっと☆バトル</title>
    <style>
      @font-face { font-family: 'Memokatchi'; font-weight: 100 900; src: url('./fonts/memokatchi-f34fc2e9.woff2') format('woff2'); font-display: block; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #2b1d4f; touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Memokatchi', sans-serif;
      }
      /* form controls don't inherit the page font by default */
      button, input, textarea, select { font-family: inherit; }
      canvas { display: block; touch-action: none; }
      #safe { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); left: 0; width: 0; pointer-events: none; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; font: 18px 'Memokatchi', sans-serif; letter-spacing: 0.1em; transition: opacity .4s;
      }
    </style>
  </head>
  <body>
    <div id="safe"></div>
    <div id="boot">LOADING…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
