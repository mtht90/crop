# Render Blueprint: deploys the puzzle game as a static site (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: puni-puzzle-battle
    runtime: static
    rootDir: puzzle
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # online ranking (Supabase → Project Settings → API); set these in the Render dashboard
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # shop (Stripe): "1" once the Edge Functions and webhook are set up; VITE_SHOP_TEST=1 while on test keys
      - key: VITE_SHOP_ENABLED
        sync: false
      - key: VITE_SHOP_TEST
        sync: false
    headers:
      # hashed bundles never change; everything else is revalidated daily
      - path: /assets/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
