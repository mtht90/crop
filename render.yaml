services:
  - type: web
    name: lynq
    runtime: node
    plan: free
    rootDir: chat
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    # Every push to the connected branch redeploys automatically.
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Stable secret: push notification (VAPID) keys are derived from it.
      - key: SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lynq-store
          property: connectionString

  # Keeps rooms, history, media and push subscriptions across web service restarts.
  - type: keyvalue
    name: lynq-store
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only
