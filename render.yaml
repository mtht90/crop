# Render Blueprint for Spirit Master (idle/). Static site: the build downloads the art packs from
# the authors' itch.io pages (they may not be committed), converts them, and bundles the game.
services:
  - type: web
    runtime: static
    name: spirit-master
    rootDir: idle
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - idle/**
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /gen/*
        name: Cache-Control
        value: public, max-age=86400
