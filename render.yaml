# The web service is "chat" (https://chat.onrender.com when the name is free).
# It shares the original "inachat-store" Key Value, so rooms and history carry over,
# and CANONICAL=1 tells the previous "inachat" service to hand its visitors over.
services:
  - type: web
    name: chat
    runtime: node
    plan: free
    rootDir: chat
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    # Every push to the connected branch redeploys automatically.
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CANONICAL
        value: "1"
      # Used only if no push keys are stored yet; keys already in the store are reused.
      - key: SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: inachat-store
          property: connectionString

  # Keeps rooms, history, media and push subscriptions across web service restarts.
  - type: keyvalue
    name: inachat-store
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only
