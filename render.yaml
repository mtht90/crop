# 共同スクラッチマップ（scratch-map/）の Render Blueprint
# フロント（Static Site）・API（Web Service / Starter）・Postgres の3つを作成する。
# サービス名を変えた場合や URL に接尾辞が付いた場合は APP_ORIGIN と VITE_API_URL を実際の URL に直すこと。

databases:
  - name: scratch-map-db
    plan: basic-256mb
    region: singapore
    databaseName: scratchmap
    user: scratchmap
    ipAllowList: [] # 外部からの接続を許可しない（API からは内部 URL で接続）

services:
  - type: web
    name: scratch-map-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: scratch-map
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: scratch-map-db
          property: connectionString
      - key: APP_ORIGIN
        value: https://scratch-map-web.onrender.com
      - key: DEV_MAGIC_LINK
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: scratch-map-web
    runtime: static
    rootDir: scratch-map
    buildCommand: npm ci && npm run build:web
    staticPublishPath: web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://scratch-map-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
