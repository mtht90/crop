<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BEACON BRAWL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700;1,800;1,900&family=Noto+Sans+JP:wght@500;700;900&display=swap" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="loading" class="screen show">
    <h1 class="logo">BEACON<span>BRAWL</span></h1>
    <div class="loadbar"><div id="loadfill"></div></div>
    <p id="loadtext">読み込み中…</p>
  </div>

  <!-- ホーム -->
  <div id="home" class="screen">
    <header class="topbar">
      <button id="me-name-btn" class="profile"><span id="h-name"></span><small>なまえ変更</small></button>
      <div class="pill trophy"><i data-icon="trophy"></i><b id="h-trophies">0</b></div>
      <div class="pill coin"><i data-icon="coin"></i><b id="h-coins">0</b></div>
      <div class="pill gem"><i data-icon="gem"></i><b id="h-gems">0</b></div>
    </header>
    <nav class="side left">
      <button id="nav-missions" class="navbtn"><i data-icon="checklist"></i><span>ミッション</span><em class="badge" hidden></em></button>
      <button id="nav-road" class="navbtn"><i data-icon="trophy"></i><span>トロフィー<br />ロード</span><em class="badge" hidden></em></button>
      <button id="nav-ranking" class="navbtn" hidden><i data-icon="podium"></i><span>ランキング</span></button>
    </nav>
    <nav class="side right">
      <button id="nav-heroes" class="navbtn"><i data-icon="swords"></i><span>キャラ</span><em class="badge" hidden></em></button>
      <button id="nav-gacha" class="navbtn gacha"><i data-icon="cards"></i><span>ガチャ</span><em class="badge" hidden></em></button>
    </nav>
    <div class="hero-tag"><span id="h-role"></span><b id="h-hero"></b><em id="h-level"></em></div>
    <div class="home-bottom">
      <div id="modes"></div>
      <p id="mode-desc"></p>
      <button id="btn-battle" class="primary">バトル</button>
    </div>
    <p id="save-note"></p>
  </div>

  <!-- キャラ一覧・強化 -->
  <div id="heroes" class="screen">
    <button class="back" data-back>‹ ホーム</button>
    <div id="info">
      <div class="ihead"><img id="i-img" alt="" /><div><div class="irole" id="i-role"></div><h2 id="i-name"></h2><div id="i-level"></div></div></div>
      <p id="i-blurb"></p>
      <div id="i-stats"></div>
      <div id="i-skills"></div>
      <div id="i-actions"></div>
    </div>
    <div id="cards"></div>
  </div>

  <!-- ガチャ -->
  <div id="gacha" class="screen">
    <button class="back" data-back>‹ ホーム</button>
    <div class="gacha-box">
      <h2 class="screen-title">スターライト・サプライ</h2>
      <p class="g-sub">強化に使う「かけら」とコインが中心。たまにキャラが手に入る</p>
      <div id="g-feature"></div>
      <p class="g-pity"><span id="g-pity"></span></p>
      <p class="g-rates" id="g-rates-text"></p>
      <div class="g-buttons">
        <button id="g-1" class="gbtn"><b>1回</b><span><i data-icon="gem"></i>100</span></button>
        <button id="g-10" class="gbtn ten"><b>10回</b><span><i data-icon="gem"></i>900</span></button>
      </div>
      <p class="g-note">かけらは持っているキャラのどれかに入ります。持っているキャラが出たときも、かけらになります。</p>
    </div>
  </div>

  <!-- ミッション・ログインボーナス -->
  <div id="missions" class="screen">
    <button class="back" data-back>‹ ホーム</button>
    <div class="sheet">
      <h2 class="screen-title">ログインボーナス</h2>
      <div id="m-login"></div>
      <h2 class="screen-title">デイリーミッション <small>毎日午前4時に更新</small></h2>
      <div id="m-list"></div>
    </div>
  </div>

  <!-- トロフィーロード -->
  <div id="road" class="screen">
    <button class="back" data-back>‹ ホーム</button>
    <div class="sheet">
      <h2 class="screen-title">トロフィーロード <small id="r-best"></small></h2>
      <div id="road-list"></div>
    </div>
  </div>

  <!-- ランキング -->
  <div id="ranking" class="screen">
    <button class="back" data-back>‹ ホーム</button>
    <div class="sheet">
      <h2 class="screen-title">トロフィーランキング</h2>
      <ol id="rank-list"></ol>
    </div>
  </div>

  <!-- 報酬・お知らせ・入力のポップアップ -->
  <div id="popup" class="overlay" hidden>
    <div class="pop">
      <h3 id="pop-title"></h3>
      <div id="pop-body"></div>
      <button id="pop-ok" class="primary">OK</button>
    </div>
  </div>
  <!-- ガチャ結果 -->
  <div id="gacha-result" class="overlay" hidden>
    <div id="gr-cards"></div>
    <button id="gr-ok" class="primary">OK</button>
  </div>
  <div id="toast" hidden></div>

  <div id="hud">
    <div id="top">
      <div id="team-blue" class="team"></div>
      <div id="score-blue" class="score blue">0</div>
      <div class="mid"><div id="timer">3:00</div><div id="beacons"></div><div id="goal"></div></div>
      <div id="score-red" class="score red">0</div>
      <div id="team-red" class="team"></div>
    </div>
    <canvas id="minimap" width="160" height="100"></canvas>
    <div id="plates"></div>
    <div id="floats"></div>
    <div id="feed"></div>
    <div id="announce"></div>
    <div id="banner"><img id="banner-img" alt="" /><div class="btext"><span id="banner-who"></span><b id="banner-skill"></b></div></div>
    <div id="count"></div>
    <div id="respawn" hidden></div>
    <div id="me">
      <img id="me-img" alt="" />
      <div class="me-body"><div id="me-name"></div><div id="myhp"><div id="myhp-bar"></div><span id="myhp-text"></span></div></div>
    </div>
    <div id="skills">
      <div id="attack" class="skill atk"></div>
      <div id="skill0" class="skill"></div>
      <div id="skill1" class="skill"></div>
      <div id="skill2" class="skill ult"></div>
    </div>
    <div id="stick"><div id="knob"></div></div>
  </div>

  <div id="result" class="screen">
    <h1 id="r-title"></h1>
    <p id="r-score"></p>
    <div id="r-rewards"></div>
    <table id="r-table"></table>
    <div class="actions">
      <button id="btn-again" class="primary">もう一度</button>
      <button id="btn-home">ホームへ</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
