<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="inachat">
<title>inachat</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- first visit: pick a name -->
<main id="onboard" class="onboard" hidden>
  <form id="onboardForm" class="card" autocomplete="off">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="34" height="34"><path fill="#fff" d="M16 4C8.8 4 3 9 3 15.2c0 3.4 1.8 6.5 4.6 8.5L6.5 28l5-2.3c1.4.4 2.9.6 4.5.6 7.2 0 13-5 13-11.1S23.2 4 16 4z"/></svg>
    </div>
    <h1 class="app-name">inachat</h1>
    <p class="lead">まずは呼ばれたい名前を決めましょう。</p>
    <label class="field">
      <span>ニックネーム</span>
      <input id="onboardName" maxlength="20" required placeholder="あなたの名前" enterkeyhint="go">
    </label>
    <button class="primary" data-press type="submit">はじめる</button>
  </form>
</main>

<div id="shell" class="shell" hidden>
  <!-- room list -->
  <aside class="side">
    <header class="side-head">
      <div class="brand"><span class="mini-logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="18" height="18"><path fill="#fff" d="M16 4C8.8 4 3 9 3 15.2c0 3.4 1.8 6.5 4.6 8.5L6.5 28l5-2.3c1.4.4 2.9.6 4.5.6 7.2 0 13-5 13-11.1S23.2 4 16 4z"/></svg></span><span class="app-name">inachat</span></div>
      <button id="profileBtn" class="me-btn" data-press type="button" aria-label="プロフィールと設定"></button>
    </header>

    <div id="notifyCard" class="notify-card" hidden>
      <div class="notify-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 9a6 6 0 0112 0c0 5 2 6.5 2 6.5H4S6 14 6 9zM10 19a2 2 0 004 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="notify-text"><b id="notifyTitle">通知を受け取る</b><span id="notifyBody">アプリを閉じていても新着メッセージが届きます</span></div>
      <button id="notifyOn" class="pill-btn" data-press type="button">オン</button>
      <button id="notifyClose" class="icon-btn small" data-press type="button" aria-label="閉じる"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>

    <div class="seg" role="tablist">
      <span class="seg-pill" aria-hidden="true"></span>
      <button class="seg-btn on" data-tab="mine" role="tab" type="button">参加中<span id="mineBadge" class="seg-badge"></span></button>
      <button class="seg-btn" data-tab="explore" role="tab" type="button">さがす</button>
    </div>

    <div class="side-body">
      <div id="mineList" class="room-list" role="list"></div>
      <div id="mineEmpty" class="list-empty" hidden>
        <p>まだ参加しているルームがありません</p>
        <button id="emptyLobby" class="ghost-btn" data-press type="button">ロビーに入ってみる</button>
      </div>
      <div id="exploreList" class="room-list" role="list" hidden></div>
      <div id="exploreEmpty" class="list-empty" hidden><p>公開ルームはまだありません</p></div>
    </div>

    <button id="createBtn" class="fab" data-press type="button" aria-label="ルームを作る">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>ルームを作る</span>
    </button>
  </aside>

  <!-- conversation -->
  <section class="chat">
    <div id="emptyPane" class="empty-pane">
      <div class="empty-art" aria-hidden="true"><i></i><i></i><i></i></div>
      <p>ルームを選ぶか、新しく作って<br>QRで友だちを招待しましょう</p>
    </div>

    <div id="room" class="room" hidden>
      <header class="bar">
        <button id="back" class="icon-btn" data-press type="button" aria-label="ルーム一覧へ">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="roomTitle" class="title" type="button">
          <strong><span id="roomName"></span><span id="roomFlags" class="flags"></span></strong>
          <span id="status" class="status"><i class="dot"></i><span id="statusText">接続中…</span></span>
        </button>
        <div id="avatars" class="avatars"></div>
        <button id="inviteBtn" class="icon-btn" data-press type="button" aria-label="QRで招待">
          <svg viewBox="0 0 24 24" width="21" height="21"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5zM14 18.5h1.5V20H14zM18.5 14H20v1.5h-1.5z" fill="currentColor"/></svg>
        </button>
        <button id="menuBtn" class="icon-btn" data-press type="button" aria-label="ルームの設定">
          <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></svg>
        </button>
      </header>

      <div id="scroller" class="scroller">
        <div id="list" class="list" role="log" aria-live="polite"></div>
      </div>

      <footer class="composer">
        <button id="toBottom" class="to-bottom" data-press type="button" aria-label="最新へ移動">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="unread" class="badge"></span>
        </button>
        <div id="typing" class="typing" aria-live="polite"><span class="dots"><i></i><i></i><i></i></span><span id="typingText"></span></div>
        <div id="replyBar" class="reply-bar">
          <div class="reply-inner">
            <div class="reply-body"><b id="replyName"></b><span id="replyText"></span></div>
            <button id="replyCancel" class="icon-btn small" data-press type="button" aria-label="返信をやめる">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="row">
          <textarea id="input" rows="1" maxlength="2000" placeholder="メッセージを入力" aria-label="メッセージ"></textarea>
          <button id="send" class="send" data-press type="button" aria-label="送信">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </footer>
    </div>
  </section>
</div>

<!-- bottom sheet / modal -->
<div id="sheetLayer" class="sheet-layer" hidden>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab" aria-hidden="true"></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="popover" class="popover" hidden></div>
<div id="toast" class="toast" role="status"></div>

<script src="/vendor/qrcode.js"></script>
<script src="/app.js"></script>
</body>
</html>
