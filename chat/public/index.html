<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chat">
<meta name="description" content="ルームを作って、QRで招待して話せるチャット">
<title>Chat</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- first visit -->
<main id="onboard" class="onboard" hidden>
  <form id="onboardForm" class="card" autocomplete="off">
    <img class="logo" src="/icon-192.png" alt="" width="68" height="68">
    <h1>Chat</h1>
    <p class="lead">まずは呼ばれたい名前を決めましょう。</p>
    <label class="field">
      <span>ニックネーム</span>
      <input id="onboardName" maxlength="20" placeholder="あなたの名前" enterkeyhint="go">
    </label>
    <button class="primary" data-press type="submit">はじめる</button>
    <button id="haveCode" class="text-btn" type="button">ほかの端末から引き継ぐ</button>
  </form>
</main>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <header class="side-head">
      <div class="brand"><img class="mini-logo" src="/icon-192.png" alt="" width="30" height="30">Chat</div>
      <div class="head-actions">
        <button id="scanBtn" class="icon-btn" data-press type="button" aria-label="QRコードを読み取る">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2M4 12h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button id="profileBtn" class="me-btn" data-press type="button" aria-label="プロフィールと設定"></button>
      </div>
    </header>

    <div id="notifyCard" class="notify-card" hidden>
      <div class="notify-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 9a6 6 0 0112 0c0 5 2 6.5 2 6.5H4S6 14 6 9zM10 19a2 2 0 004 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="notify-text"><b id="notifyTitle">通知を受け取る</b><span id="notifyBody">アプリを閉じていても新着メッセージが届きます</span></div>
      <button id="notifyOn" class="pill-btn" data-press type="button">オン</button>
      <button id="notifyClose" class="icon-btn small" data-press type="button" aria-label="閉じる"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>

    <div class="seg" role="tablist">
      <span class="seg-pill" aria-hidden="true"></span>
      <button class="seg-btn on" data-tab="mine" role="tab" type="button">トーク<span id="mineBadge" class="seg-badge"></span></button>
      <button class="seg-btn" data-tab="explore" role="tab" type="button">さがす</button>
    </div>

    <div class="side-body">
      <div id="mineList" class="room-list" role="list"></div>
      <div id="mineEmpty" class="list-empty" hidden>
        <p>まだ参加しているルームがありません</p>
        <button id="emptyLobby" class="ghost-btn" data-press type="button">ロビーに入ってみる</button>
      </div>
      <div id="exploreList" class="room-list" role="list" hidden></div>
      <div id="exploreEmpty" class="list-empty" hidden><p>公開ルームはまだありません</p></div>
    </div>

    <button id="createBtn" class="fab" data-press type="button" aria-label="ルームを作る">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>ルームを作る</span>
    </button>
  </aside>

  <section class="chat">
    <div id="emptyPane" class="empty-pane">
      <div class="empty-art" aria-hidden="true"><i></i><i></i><i></i></div>
      <p>ルームを選ぶか、新しく作って<br>QRで友だちを招待しましょう</p>
    </div>

    <div id="room" class="room" hidden>
      <header class="bar">
        <button id="back" class="icon-btn" data-press type="button" aria-label="トーク一覧へ">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="roomTitle" class="title" type="button">
          <strong><span id="roomName"></span><span id="roomFlags" class="flags"></span></strong>
          <span id="status" class="status"><i class="dot"></i><span id="statusText">接続中…</span></span>
        </button>
        <div id="avatars" class="avatars"></div>
        <button id="voiceCallBtn" class="icon-btn" data-press type="button" aria-label="音声通話">
          <svg viewBox="0 0 24 24" width="21" height="21"><path d="M6.6 3.5l2.6.4 1.3 4-1.9 1.6a12 12 0 005.9 5.9l1.6-1.9 4 1.3.4 2.6c-.2 1.7-1.6 3-3.3 3A15.6 15.6 0 013.5 6.8c0-1.7 1.3-3.1 3.1-3.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button id="videoCallBtn" class="icon-btn" data-press type="button" aria-label="ビデオ通話">
          <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="6" width="13" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 10.5l5-3v9l-5-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button id="menuBtn" class="icon-btn" data-press type="button" aria-label="ルームの設定">
          <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></svg>
        </button>
      </header>

      <div id="callBanner" class="call-banner" hidden>
        <span class="call-banner-dot" aria-hidden="true"></span>
        <span id="callBannerText">通話中</span>
        <button id="callJoin" class="pill-btn" data-press type="button">参加</button>
      </div>

      <div id="scroller" class="scroller">
        <div id="loadMore" class="load-more" hidden><span class="spinner"></span></div>
        <div id="list" class="list" role="log" aria-live="polite"></div>
      </div>

      <footer class="composer">
        <button id="toBottom" class="to-bottom" data-press type="button" aria-label="最新へ移動">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="unread" class="badge"></span>
        </button>
        <div id="typing" class="typing" aria-live="polite"><span class="dots"><i></i><i></i><i></i></span><span id="typingText"></span></div>
        <div id="mentionBox" class="mention-box" hidden></div>
        <div id="replyBar" class="reply-bar">
          <div class="reply-inner">
            <div class="reply-body"><b id="replyName"></b><span id="replyText"></span></div>
            <button id="replyCancel" class="icon-btn small" data-press type="button" aria-label="やめる">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div id="composeRow" class="row">
          <button id="photoBtn" class="tool-btn" data-press type="button" aria-label="写真を送る">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="5" width="18" height="14" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M4 17l5-4.5 3.5 3 3-2.5L21 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <textarea id="input" rows="1" maxlength="2000" placeholder="メッセージを入力" aria-label="メッセージ"></textarea>
          <button id="send" class="send" data-press type="button" aria-label="音声メッセージを録音">
            <svg class="i-mic" viewBox="0 0 24 24" width="21" height="21"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <svg class="i-send" viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div id="recBar" class="rec-bar" hidden>
          <button id="recCancel" class="icon-btn" data-press type="button" aria-label="録音をやめる">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="rec-dot" aria-hidden="true"></span>
          <span id="recTime" class="rec-time">0:00</span>
          <div id="recWave" class="rec-wave" aria-hidden="true"></div>
          <button id="recSend" class="send ready" data-press type="button" aria-label="音声を送信">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <input id="fileInput" type="file" accept="image/*" hidden>
      </footer>
    </div>
  </section>
</div>

<div id="sheetLayer" class="sheet-layer" hidden>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab" aria-hidden="true"></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="viewer" class="viewer" hidden><img id="viewerImg" alt=""></div>
<div id="popover" class="popover" hidden></div>
<div id="toast" class="toast" role="status"></div>

<script src="/vendor/qrcode.js"></script>
<script src="/vendor/jsqr.js"></script>
<script src="/scanner.js"></script>
<script src="/call.js"></script>
<script src="/app.js"></script>
</body>
</html>
