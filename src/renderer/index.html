<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob: http: https:; style-src 'self'; script-src 'self'">
  <title>Folio</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="renderer.js"></script>
</head>
<body data-mode="browse">
  <header id="chrome">
    <div id="strip">
      <button id="overview-btn" class="icon-btn" data-icon="grid" title="オーバービュー (Ctrl+E)"></button>
      <div id="pills"><div id="glider"></div></div>
      <button id="new-tab" class="icon-btn" data-icon="plus" title="新しいページ (Ctrl+T)"></button>
    </div>

    <div id="toolbar">
      <button id="back" class="icon-btn" data-icon="back" title="戻る (Alt+←)"></button>
      <button id="forward" class="icon-btn" data-icon="forward" title="進む (Alt+→)"></button>
      <button id="reload" class="icon-btn" data-icon="reload" title="再読み込み (Ctrl+R)"></button>

      <form id="omnibox" autocomplete="off">
        <span id="omni-icon" data-icon="search"></span>
        <input id="address" type="text" spellcheck="false" placeholder="検索するか URL を入力">
        <span id="omni-hint"></span>
        <button type="button" id="zoom-indicator" hidden title="ズームをリセット"></button>
        <button type="button" id="pin-btn" class="icon-btn small" data-icon="pin" title="このタブを固定 (Ctrl+D)"></button>
      </form>

      <button id="btn-downloads" class="icon-btn" data-icon="download" title="ダウンロード (Ctrl+J)">
        <span id="download-badge" hidden></span>
      </button>
      <button id="btn-settings" class="icon-btn" data-icon="settings" title="設定"></button>
    </div>

    <div id="findbar" hidden>
      <input id="find-input" type="text" spellcheck="false" placeholder="ページ内を検索">
      <span id="find-count"></span>
      <button id="find-prev" class="icon-btn small" data-icon="up" title="前へ (Shift+Enter)"></button>
      <button id="find-next" class="icon-btn small" data-icon="down" title="次へ (Enter)"></button>
      <button id="find-close" class="icon-btn small" data-icon="close" title="閉じる (Esc)"></button>
    </div>
  </header>

  <main id="overview" hidden>
    <div id="ov-scroll">
      <div id="ov-content">
        <div id="ov-summary"></div>
        <section id="ov-grid"></section>
        <section id="ov-pile" class="ov-section" hidden>
          <h3>あまり見ないページ <span class="count"></span></h3>
          <div class="chips"></div>
        </section>
        <section id="ov-suggest" class="ov-section" hidden>
          <h3>閉じたけれど、よく戻っていたページ</h3>
          <div class="chips"></div>
        </section>
        <section id="ov-history" class="ov-section" hidden>
          <h3>履歴から</h3>
          <div class="rows"></div>
        </section>
        <div id="ov-empty" hidden></div>
        <div id="ov-ring"></div>
        <div id="ov-peek" hidden></div>
      </div>
    </div>
  </main>

  <div id="morph-layer"></div>

  <aside id="panel" hidden>
    <div class="panel-header">
      <h2 id="panel-title"></h2>
      <button id="panel-close" class="icon-btn small" data-icon="close" title="閉じる"></button>
    </div>
    <div id="panel-body"></div>
  </aside>
</body>
</html>
