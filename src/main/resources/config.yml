# CropSneakGrowth 設定

# しゃがみ判定を行う範囲(プレイヤー中心の半径, ブロック単位)
radius: 2.5

# 何回しゃがむと1段階成長するか(作物1つごとにカウント)
required-sneaks: 5

# 1回のトリガーで進める成長段階の数
growth-per-trigger: 1

# 同じ作物へのカウントを受け付ける最短間隔(ミリ秒)。連打・マクロ対策。
cooldown-millis: 250

# エフェクト(パーティクル・音)を再生するか
effects-enabled: true

# 対象にする作物の種類 (Bukkit Material名)
crops:
  - WHEAT
  - CARROTS
  - POTATOES
  - BEETROOTS
  - NETHER_WART
  - PUMPKIN_STEM
  - MELON_STEM
