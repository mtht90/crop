<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a1c" />
    <link rel="manifest" href="./manifest.webmanifest?v=3" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARCANE BEASTS" />
    <title>ARCANE BEASTS — トレーディングカードゲーム</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=3" />
  </head>
  <body>
    <script>
      // 引っ越し: the old address sends its saved data here as #move=… (the part
      // after # never reaches any server). Runs before the game reads its save.
      (function () {
        var m = /[#&]move=([^&]+)/.exec(location.hash);
        if (!m) return;
        try {
          var bin = atob(decodeURIComponent(m[1]));
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var data = JSON.parse(new TextDecoder().decode(bytes));
          var KEY = 'arcane-beasts-save-v1';
          var here = localStorage.getItem(KEY);
          var started = false;
          try { started = !!(here && JSON.parse(here).started); } catch (e) {}
          var ok = !started || confirm('前のアドレスで遊んでいたデータが届きました。\nこの端末の新しいアドレスのデータを、前のアドレスのデータで上書きしますか？');
          if (ok) for (var k in data) if (k.indexOf('arcane-beasts-') === 0 && k !== 'arcane-beasts-server') localStorage.setItem(k, data[k]);
        } catch (e) {
          /* a broken link only means nothing is moved */
        }
        history.replaceState(null, '', location.pathname + location.search);
      })();
    </script>
    <!-- shown the moment the page opens, while the game itself downloads; the game removes it -->
    <div id="boot" style="position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#16255a,#060a1c 70%)">
      <style>
        @keyframes boot-glow{0%,100%{box-shadow:0 0 40px rgba(120,170,255,.35)}50%{box-shadow:0 0 80px rgba(150,190,255,.7)}}
        @keyframes boot-bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
        #boot img{width:min(46vmin,300px);aspect-ratio:1;border-radius:20%;animation:boot-glow 2.2s ease-in-out infinite}
        #boot .b{position:absolute;left:50%;bottom:max(40px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(70vw,360px);height:4px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
        #boot .b i{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#9fd0ff,transparent);animation:boot-bar 1.1s linear infinite}
        #boot .t{position:absolute;left:0;right:0;bottom:calc(max(40px,env(safe-area-inset-bottom)) + 14px);text-align:center;color:#cfe0ff;font:800 11px/1 system-ui,sans-serif;letter-spacing:.3em}
      </style>
      <img src="./icons/icon-512.png?v=3" alt="ARCANE BEASTS" />
      <div class="t">NOW LOADING</div>
      <div class="b"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
