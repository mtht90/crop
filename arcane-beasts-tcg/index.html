<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a1c" />
    <link rel="manifest" href="./manifest.webmanifest?v=4" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARCANE BEASTS" />
    <title>ARCANE BEASTS — トレーディングカードゲーム</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=4" />
  </head>
  <body>
    <script>
      // 引っ越し: the old address sends its saved data here as #move=… (the part
      // after # never reaches any server). Runs before the game reads its save.
      (function () {
        var m = /[#&]move=([^&]+)/.exec(location.hash);
        if (!m) return;
        try {
          var bin = atob(decodeURIComponent(m[1]));
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var data = JSON.parse(new TextDecoder().decode(bytes));
          var KEY = 'arcane-beasts-save-v1';
          var here = localStorage.getItem(KEY);
          var started = false;
          try { started = !!(here && JSON.parse(here).started); } catch (e) {}
          var ok = !started || confirm('前のアドレスで遊んでいたデータが届きました。\nこの端末の新しいアドレスのデータを、前のアドレスのデータで上書きしますか？');
          if (ok) for (var k in data) if (k.indexOf('arcane-beasts-') === 0 && k !== 'arcane-beasts-server') localStorage.setItem(k, data[k]);
        } catch (e) {
          /* a broken link only means nothing is moved */
        }
        history.replaceState(null, '', location.pathname + location.search);
      })();
    </script>
    <!-- shown the moment the page opens, while the game itself downloads; the game removes it -->
    <div id="boot" style="position:fixed;inset:0;z-index:3000;background:#060a1c;overflow:hidden">
      <style>
        @keyframes boot-in{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
        @keyframes boot-bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
        #boot .a{position:absolute;inset:0;background:url(./assets/ui/dragon.webp) 62% 30%/cover;filter:brightness(.7);animation:boot-in 1.2s ease-out both}
        #boot .s{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,18,.75),transparent 30%,transparent 60%,rgba(4,6,18,.95))}
        #boot .l{position:absolute;left:0;right:0;top:max(8vh,env(safe-area-inset-top));text-align:center;font:900 clamp(30px,8.6vw,92px)/1 Cinzel,serif;letter-spacing:.06em;background:linear-gradient(180deg,#fffdf0,#ffe08a 35%,#c98d1f 62%,#fff1b3 80%,#b8801c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #3a2200) drop-shadow(0 0 30px rgba(255,190,80,.55));animation:boot-in 1s .2s ease-out both}
        #boot .b{position:absolute;left:50%;bottom:max(40px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(80vw,600px);height:6px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
        #boot .b i{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#ffd47a,transparent);animation:boot-bar 1.1s linear infinite}
        @media (orientation:portrait){#boot .l{font-size:min(16vw,84px);line-height:1.02;padding:0 6vw}}
        #boot .t{position:absolute;left:0;right:0;bottom:calc(max(40px,env(safe-area-inset-bottom)) + 16px);text-align:center;color:#ffe9b0;font:800 12px/1 system-ui,sans-serif;letter-spacing:.3em}
      </style>
      <div class="a"></div><div class="s"></div>
      <div class="l">ARCANE BEASTS</div>
      <div class="t">NOW LOADING</div>
      <div class="b"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
