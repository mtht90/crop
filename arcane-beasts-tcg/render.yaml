# Render Blueprint: New → Blueprint → choose this repository.
services:
  - type: web
    name: arcane-beasts
    runtime: node
    plan: free
    # the build needs the dev dependencies (vite, TypeScript), so ask npm for them explicitly
    buildCommand: npm ci --include=dev && npm run build:web
    startCommand: npm run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      # where player records are kept (see docs/ONLINE.md); without them the server's own disk is used,
      # which Render's free plan wipes on every restart
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
