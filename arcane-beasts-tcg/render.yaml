# Render Blueprint: New → Blueprint → choose this repository.
services:
  - type: web
    name: arcane-beasts
    runtime: node
    plan: free
    # the game is built before it is pushed (web/ is in the repository), so the
    # host only installs what the server needs — no build, well inside the free plan's memory
    buildCommand: npm ci --omit=dev
    startCommand: npm run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      # where player records are kept (see docs/ONLINE.md); without them the server's own disk is used,
      # which Render's free plan wipes on every restart
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
