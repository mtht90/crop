<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141a38">
<title>果てなき荒野 — ENDLESS WILDS</title>
<meta name="description" content="ブラウザで遊べる、オープンワールド×ローグライク×サバイバーアクション。">
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="fx2d"></canvas>
  <div id="vignette"></div>
  <div id="fever-frame"></div>
  <div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><div id="lvbadge">Lv 1</div></div>
    <div id="feverbar"><div id="feverfill"></div><span>FEVER</span></div>
    <div id="hud-left">
      <div id="hpwrap"><div id="hpfill"></div><span id="hptext">100/100</span></div>
      <div id="slots-w" class="slots"></div>
      <div id="slots-p" class="slots"></div>
      <div id="slots-r" class="slots relics"></div>
    </div>
    <div id="hud-top">
      <div id="timer">00:00</div>
      <div id="objective">封印塔 0/3</div>
    </div>
    <div id="hud-right">
      <div class="stat"><span class="ico">☠</span><span id="kills">0</span></div>
      <div class="stat gold"><span class="ico">●</span><span id="gold">0</span></div>
      <canvas id="minimap" width="300" height="300"></canvas>
      <div id="danger"></div>
    </div>
    <div id="combo" class="hidden"><div id="combonum">0</div><div id="combolbl">COMBO</div><div id="combobonus">EXP +0%</div></div>
    <div id="challenge" class="hidden"></div>
    <div id="bossbar" class="hidden"><div id="bossname"></div><div id="bosshp"><div id="bossfill"></div></div></div>
    <div id="dashbtn"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="bg"/><circle id="dashring" cx="50" cy="50" r="44" class="ring"/></svg><span>ダッシュ</span></div>
    <button id="pausebtn" aria-label="一時停止">II</button>
    <div id="banner"><div id="banner-t"></div><div id="banner-s"></div></div>
    <div id="toasts"></div>
  </div>
  <div id="joy" class="hidden"><div id="joyknob"></div></div>
  <div id="screens"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
