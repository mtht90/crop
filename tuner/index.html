<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Strobe Tuner</title>
<style>
  /* Full-bleed strobe on top, note and cents below, a quiet toolbar at the bottom. */
  :root {
    --bg: #000;
    --text: #f4f6f8;
    --muted: #7c838d;
    --line: #23262b;
    --accent: rgb(30, 160, 240);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .app {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .strobe-wrap { position: relative; flex: 1 1 62%; min-height: 160px; background: #000; }
  .strobe-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hint {
    position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%);
    text-align: center; color: var(--muted); font-size: 17px; line-height: 1.6; pointer-events: none;
  }

  .trace-wrap { position: relative; flex: 0 0 auto; height: clamp(56px, 10vh, 120px); border-top: 1px solid var(--line); }
  .trace-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .display {
    flex: 0 0 auto;
    height: clamp(120px, 26vh, 300px);
    display: flex; align-items: center; justify-content: center;
    gap: clamp(24px, 6vw, 90px);
    padding: 0 16px;
  }
  .note { display: flex; align-items: flex-end; font-weight: 700; line-height: .8; transition: opacity .3s; }
  .note .name { font-size: clamp(90px, 21vh, 240px); letter-spacing: -.02em; }
  .note .acc { font-size: clamp(36px, 8vh, 90px); align-self: flex-start; margin-left: .05em; }
  .note .oct { font-size: clamp(30px, 6.5vh, 72px); margin-left: .35em; margin-bottom: .05em; font-weight: 600; }
  .readout { display: flex; flex-direction: column; align-items: center; font-variant-numeric: tabular-nums; transition: opacity .3s; }
  .readout .num { font-size: clamp(30px, 6.5vh, 72px); font-weight: 600; line-height: 1; min-width: 3.4ch; text-align: center; }
  .readout .stab { font-size: clamp(12px, 2vh, 18px); color: var(--muted); margin-top: .3em; min-height: 1.2em; }
  .note { cursor: pointer; }
  .guide { font-size: clamp(13px, 2vh, 17px); color: var(--accent); margin-top: .5em; text-align: center; white-space: pre-line; line-height: 1.5; min-height: 1.5em; }
  .row input[type=number] { width: 4.5em; font: inherit; font-size: 15px; color: var(--text); background: #16191e; border: 1px solid var(--line); border-radius: 8px; min-height: 36px; padding: 0 6px; }
  .calib { flex-wrap: wrap; padding-block: 6px; }
  .calib .lab { white-space: normal; flex: 1 1 12em; line-height: 1.4; }
  .calib .tool-group { gap: 4px; }
  .readout .unit { font-size: clamp(13px, 2.4vh, 24px); color: var(--text); margin-top: .25em; letter-spacing: .02em; }
  .idle { opacity: .3; }

  .toolbar {
    flex: 0 0 auto;
    display: flex; align-items: stretch; justify-content: center; flex-wrap: wrap;
    border-top: 1px solid var(--line);
    padding: 0 8px;
  }
  .toolbar > * + * { border-left: 1px solid var(--line); }
  button {
    font: inherit; color: var(--muted); background: transparent; border: 0;
    min-height: 48px; min-width: 48px; padding: 0 14px; font-size: 15px; cursor: pointer;
  }
  button:active { color: var(--text); }
  button.on { color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tool-group { display: flex; align-items: center; }
  .val { color: var(--text); font-size: 15px; min-width: 4ch; text-align: center; font-variant-numeric: tabular-nums; }
  .err { position: absolute; left: 16px; right: 16px; bottom: calc(60px + env(safe-area-inset-bottom)); text-align: center; color: #ff8a80; font-size: 14px; pointer-events: none; }

  .panel {
    position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: calc(56px + env(safe-area-inset-bottom));
    width: min(360px, calc(100% - 24px));
    background: #0d0f12; border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 16px 12px; display: grid; gap: 4px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row label, .row .lab { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .row select { font: inherit; font-size: 15px; color: var(--text); background: #16191e; border: 1px solid var(--line); border-radius: 8px; min-height: 36px; padding: 0 8px; }
  .row button { padding: 0 10px; color: var(--text); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { min-height: 36px; min-width: 44px; color: var(--muted); }
  .seg button.on { background: #1b2028; color: var(--accent); }
  .panel { max-height: calc(100% - 80px); overflow-y: auto; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 28px; height: 28px; min-width: 28px; min-height: 28px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .swatch.on { border-color: var(--text); }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="strobe-wrap">
    <canvas id="strobe"></canvas>
    <div class="hint" id="hint">マイクをタップして楽器を鳴らしてください<br>縞が右へ流れる＝高い ／ 左へ流れる＝低い ／ 止まる＝合っている</div>
  </section>

  <section class="trace-wrap" id="traceWrap"><canvas id="trace"></canvas></section>

  <section class="display">
    <div class="note idle" id="note"><span class="name" id="noteName">A</span><span class="acc" id="noteAcc"></span><span class="oct" id="noteOct">4</span></div>
    <div class="readout idle" id="readout"><span class="num" id="cents">0.0</span><span class="unit">cents</span><span class="stab" id="stab"></span><span class="guide" id="guide"></span></div>
  </section>

  <nav class="toolbar">
    <button id="micBtn">マイク</button>
    <button id="demoBtn">デモ</button>
    <button id="fileBtn">ファイル</button>
    <input type="file" id="fileIn" accept="audio/*" hidden>
    <div class="tool-group">
      <button data-mode="auto" class="on">自動</button>
      <button data-mode="manual">手動</button>
    </div>
    <div class="tool-group">
      <button id="noteDown" aria-label="半音下げる">◀</button>
      <span class="val" id="noteSel">A4</span>
      <button id="noteUp" aria-label="半音上げる">▶</button>
    </div>
    <button id="refBtn">基準音</button>
    <button id="setBtn">設定</button>
  </nav>

  <div class="err" id="err"></div>

  <div class="panel" id="panel" hidden>
    <div class="row">
      <span class="lab">A4 基準</span>
      <div class="tool-group">
        <button id="calDown" aria-label="基準周波数を下げる">−</button>
        <span class="val" id="calVal">440.0 Hz</span>
        <button id="calUp" aria-label="基準周波数を上げる">＋</button>
      </div>
    </div>
    <div class="row"><span class="lab">目標 / 入力</span><span class="val" id="freqInfo">440.00 / --- Hz</span></div>
    <div class="row">
      <span class="lab">楽器</span>
      <div class="seg"><button data-inst="general">汎用</button><button data-inst="tuba">チューバ</button></div>
    </div>
    <div class="row tuba-only">
      <span class="lab">管の調</span>
      <div class="seg"><button data-key="Bb">B♭</button><button data-key="C">C</button><button data-key="Eb">E♭</button><button data-key="F">F</button></div>
    </div>
    <div class="row tuba-only"><span class="lab">管の感度</span><span class="val" id="slideK">---</span></div>
    <div class="row tuba-only calib">
      <span class="lab" id="calibText">実測：チューニング音を吹いて「記録」</span>
      <div class="tool-group">
        <input type="number" id="calibMm" value="10" min="2" max="60" aria-label="抜く長さ (mm)"><span class="lab">mm</span>
        <button id="calibBtn">記録</button>
        <button id="calibReset">理論値</button>
      </div>
    </div>
    <div class="row tuba-only"><span class="lab">響きの中心で補正（試験的）</span><div class="seg"><button data-opt="centerCorrect" data-v="1">オン</button><button data-opt="centerCorrect" data-v="0">オフ</button></div></div>
    <div class="row">
      <span class="lab">表記</span>
      <div class="seg"><button data-acc="sharp">♯</button><button data-acc="flat">♭</button><button data-acc="german">ドイツ</button></div>
    </div>
    <div class="row general-only"><span class="lab">インハーモニシティ B</span><span class="val" id="inharmInfo">---</span></div>
    <div class="row general-only"><span class="lab">倍音補正（弦の硬さ）</span><div class="seg"><button data-opt="inharm" data-v="1">オン</button><button data-opt="inharm" data-v="0">オフ</button></div></div>
    <div class="row"><span class="lab">アタック除外</span><div class="seg"><button data-opt="attack" data-v="1">オン</button><button data-opt="attack" data-v="0">オフ</button></div></div>
    <div class="row"><span class="lab">倍音ごとの値</span><div class="seg"><button data-opt="showPartials" data-v="1">表示</button><button data-opt="showPartials" data-v="0">非表示</button></div></div>
    <div class="row"><span class="lab">履歴グラフ</span><div class="seg"><button data-opt="showTrace" data-v="1">表示</button><button data-opt="showTrace" data-v="0">非表示</button></div></div>
    <div class="row"><label for="sens">感度</label><input type="range" id="sens" min="0" max="100" value="60"></div>
    <div class="row"><label for="vol">基準音量</label><input type="range" id="vol" min="0" max="100" value="50"></div>
    <div class="row">
      <label for="wave">基準音の波形</label>
      <select id="wave">
        <option value="sine">サイン</option>
        <option value="triangle">三角</option>
        <option value="sawtooth">ノコギリ</option>
      </select>
    </div>
    <div class="row"><span class="lab">色</span><div class="swatches" id="colors"></div></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- constants ----------
  const PARTIALS = 8;                       // partials 1..8 are measured
  const MULT = [1, 2, 3, 4, 5, 6, 7, 8];
  const SHOW = [0, 1, 3, 7];                // drawn as bands: x1 x2 x4 x8 (octaves)
  const BANDS = SHOW.length;
  const NAMES_SHARP = ['C', 'C', 'D', 'D', 'E', 'F', 'F', 'G', 'G', 'A', 'A', 'B'];
  const NAMES_FLAT  = ['C', 'D', 'D', 'E', 'E', 'F', 'G', 'G', 'A', 'A', 'B', 'B'];
  // German names, as used in Japanese wind bands (B = B-flat, H = B natural)
  const NAMES_GERMAN = ['C', 'Cis', 'D', 'Es', 'E', 'F', 'Fis', 'G', 'As', 'A', 'B', 'H'];
  // tuba: concert pitch of the pedal (open fundamental) for each key
  const TUBA_PEDAL = { Bb: 22, C: 24, Eb: 27, F: 29 };
  const TUBA_KEY_LABEL = { Bb: 'B♭', C: 'C', Eb: 'E♭', F: 'F' };
  const CENTER_WIDTH = 35; // cents; curvature of an air-column resonance peak (see centerEstimate)
  const ACCIDENTAL  = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
  const INHARM_K = 1200 / Math.LN2 / 2; // cents per unit B*k^2 (f_k = k f0 sqrt(1 + B k^2))
  const MIDI_MIN = 21;  // A0 (below the B-flat tuba pedal)
  const MIDI_MAX = 100; // E7
  // [lit segment, unlit segment]
  const THEMES = {
    blue:  [[30, 160, 240], [10, 30, 90]],
    red:   [[255, 70, 52], [70, 12, 10]],
    amber: [[255, 178, 63], [70, 40, 8]],
    green: [[90, 240, 130], [10, 60, 25]],
    white: [[235, 238, 245], [50, 54, 62]],
  };

  // ---------- persisted settings ----------
  const settings = { a4: 440, mode: 'auto', manualMidi: 69, sens: 60, vol: 50, wave: 'sine', theme: 'blue', notation: 'flat', instrument: 'general', tubaKey: 'Bb', slideK: null, centerCorrect: true, showPartials: true, showTrace: true, attack: true, inharm: true };
  try { Object.assign(settings, JSON.parse(localStorage.getItem('strobe-tuner') || '{}')); } catch (_) {}
  if (settings.flat === true && settings.notation === 'sharp') settings.notation = 'flat'; // older saved setting
  delete settings.flat;
  const isTuba = () => settings.instrument === 'tuba';
  const save = () => { try { localStorage.setItem('strobe-tuner', JSON.stringify(settings)); } catch (_) {} };

  // ---------- dom ----------
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const canvas = $('strobe');
  const g = canvas.getContext('2d');

  // ---------- audio state ----------
  let ac = null, micStream = null, inputNode = null, analyser = null, strobeNode = null;
  let extraNodes = [];
  let refOsc = null, refGain = null;
  let running = false;
  let wakeLock = null;

  // ---------- tuning state ----------
  let targetMidi = settings.mode === 'manual' ? settings.manualMidi : null;
  let f0 = 440;
  let settleUntilFrame = 0;
  let lastRms = 0;
  let lastSignalTime = 0;
  let switchCount = 0;

  const band = [];
  for (let k = 0; k < PARTIALS; k++) {
    band.push({
      pending: [],      // phases received since the last frame
      last: 0,          // most recent phase
      amp: 0,
      clarity: 0,
      raw: null,        // for unwrapping
      unwrapped: 0,
      hist: [],         // [{t, p}] for slope (frequency) estimation
    });
  }
  // fused estimate (Kalman), per-partial readings and history
  const kal = { x: null, P: 0 };
  const partial = new Array(PARTIALS).fill(null); // {c, sd} cents per partial
  let inharmB = null;
  let trace = [];          // [{t, c}] for the history graph and stability
  let narrow = false, lockSince = 0;
  let rmsSlow = 0;
  let rmsHist = [];        // [{t, a}] ln(input rms) per block
  let wob = [];            // [{t, c, a}] short-time pitch and level, for resonance-center detection
  let center = null;       // {d, se}: played pitch minus resonance center, cents

  const midiToFreq = (m) => settings.a4 * Math.pow(2, (m - 69) / 12);
  function noteParts(m) {
    const pc = m % 12, oct = Math.floor(m / 12) - 1;
    if (settings.notation === 'german') return { name: NAMES_GERMAN[pc], acc: '', oct };
    const flat = settings.notation === 'flat';
    return {
      name: (flat ? NAMES_FLAT : NAMES_SHARP)[pc],
      acc: ACCIDENTAL[pc] ? (flat ? '♭' : '♯') : '',
      oct,
    };
  }
  const noteLabel = (m) => { const n = noteParts(m); return n.name + n.acc + n.oct; };

  // ---------- target handling ----------
  function setTarget(m) {
    targetMidi = Math.max(MIDI_MIN, Math.min(MIDI_MAX, m));
    const f = midiToFreq(targetMidi);
    if (f !== f0) {
      f0 = f;
      if (strobeNode) strobeNode.port.postMessage({ f0 });
      for (const b of band) { b.raw = null; b.hist.length = 0; b.pending.length = 0; }
      kal.x = null; inharmB = null; trace = []; wob = []; center = null;
      setNarrow(false);
    }
    if (refOsc) refOsc.frequency.setTargetAtTime(f0, ac.currentTime, 0.01);
    renderNote();
  }

  function renderNote() {
    const m = targetMidi ?? 69;
    const n = noteParts(m);
    $('noteName').textContent = n.name;
    $('noteAcc').textContent = n.acc;
    $('noteOct').textContent = n.oct;
    $('noteSel').textContent = noteLabel(m);
    for (const b of document.querySelectorAll('[data-mode]')) b.classList.toggle('on', b.dataset.mode === settings.mode);
    $('calVal').textContent = settings.a4.toFixed(1) + ' Hz';
  }

  // ---------- worklet messages ----------
  function clearHistory() {
    for (const b of band) { b.raw = null; b.hist.length = 0; }
  }

  function setNarrow(on) {
    if (on === narrow) return;
    narrow = on;
    if (strobeNode) strobeNode.port.postMessage({ narrow: on });
  }

  function onBlock(msg) {
    if (msg.type === 'retarget' || msg.type === 'bandwidth') {
      // filters were reset or retuned; their phase delay changes, so let them
      // settle and restart the phase history before trusting the slope again
      settleUntilFrame = msg.frame + Math.round(ac.sampleRate * (msg.type === 'bandwidth' ? 0.15 : 0.08));
      clearHistory();
      return;
    }
    lastRms = msg.rms;
    // a new pluck: the attack is sharp and noisy, so drop it from the estimate
    if (settings.attack && msg.rms > gateLevels()[1] && msg.rms > 2.5 * rmsSlow + 1e-4) {
      settleUntilFrame = Math.max(settleUntilFrame, msg.frame + Math.round(ac.sampleRate * 0.12));
      clearHistory();
      setNarrow(false);
      kal.P += 4;
      wob = [];
    }
    rmsHist.push({ t: msg.frame / ac.sampleRate, a: Math.log(msg.rms + 1e-9) });
    if (rmsHist.length > 1200) rmsHist.splice(0, rmsHist.length - 1100);
    rmsSlow += (msg.rms - rmsSlow) * (msg.rms > rmsSlow ? 0.01 : 0.003);

    const t = msg.frame / ac.sampleRate;
    const settled = msg.frame >= settleUntilFrame;
    const win = narrow ? 0.6 : 0.35;
    for (let k = 0; k < PARTIALS; k++) {
      const b = band[k];
      const p = msg.phase[k];
      b.last = p;
      b.amp = msg.amp[k];
      if (b.pending.length < 64) b.pending.push(p);
      if (!settled) continue;
      if (b.raw === null) { b.unwrapped = p; }
      else {
        let d = p - b.raw;
        if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
        b.unwrapped += d;
      }
      b.raw = p;
      b.hist.push({ t, p: b.unwrapped });
      while (b.hist.length && t - b.hist[0].t > win) b.hist.shift();
    }
  }

  // least-squares line through unwrapped phase: slope = 2*pi*(frequency error)
  // of that partial, se = its standard error (how much to trust it)
  function slopeStats(hist) {
    const n = hist.length;
    if (n < 16) return null;
    const t0 = hist[0].t;
    let st = 0, sp = 0;
    for (const h of hist) { st += h.t - t0; sp += h.p; }
    const mt = st / n, mp = sp / n;
    let stt = 0, stp = 0;
    for (const h of hist) { const dt = h.t - t0 - mt; stt += dt * dt; stp += dt * (h.p - mp); }
    if (stt <= 0) return null;
    const slope = stp / stt;
    let ssr = 0;
    for (const h of hist) { const r = h.p - mp - slope * (h.t - t0 - mt); ssr += r * r; }
    return { slope, se: Math.sqrt(ssr / (n - 2) / stt) };
  }

  // Combine every partial into one reading of the fundamental.
  // Real strings are stiff: partial k sits at k*f0*sqrt(1 + B k^2), so higher
  // partials read sharp. With three or more partials a weighted fit of
  // c_k = c0 + INHARM_K*B*(k^2 - 1) separates the tuning (c0) from the
  // stiffness (B); otherwise the readings are averaged by their precision.
  function fuse() {
    const m = [];
    for (let k = 0; k < PARTIALS; k++) {
      partial[k] = null;
      const b = band[k];
      if (b.clarity < 0.12) continue;
      const st = slopeStats(b.hist);
      if (!st) continue;
      const fk = MULT[k] * f0;
      const c = 1200 * Math.log2(Math.max(1e-6, 1 + st.slope / (2 * Math.PI) / fk));
      const sd = Math.max(0.01, (1200 / Math.LN2) * st.se / (2 * Math.PI * fk));
      if (Math.abs(c) > 80) continue;
      partial[k] = { c, sd };
      m.push({ g: MULT[k] * MULT[k] - 1, c, w: 1 / (sd * sd) });
    }
    if (!m.length) return null;
    let sw = 0, swc = 0;
    for (const e of m) { sw += e.w; swc += e.w * e.c; }
    let c0 = swc / sw, v0 = 1 / sw;
    inharmB = null;
    if (settings.inharm && !isTuba() && m.length >= 3) {
      let sg = 0, sgg = 0, sgc = 0;
      for (const e of m) { sg += e.w * e.g; sgg += e.w * e.g * e.g; sgc += e.w * e.g * e.c; }
      const det = sw * sgg - sg * sg;
      if (det > 0) {
        const beta = (sw * sgc - sg * swc) / det;
        const B = beta / INHARM_K;
        if (B > 0 && B < 0.02) {
          c0 = (swc - beta * sg) / sw;
          v0 = sgg / det;
          inharmB = B;
        }
      }
    }
    return { c: c0, v: v0 };
  }

  // ---------- resonance-center detection (tuba mode, experimental) ----------
  // A brass player can bend a note away from where the air column resonates.
  // The column's response peaks at its resonance, so while the note wobbles
  // naturally (breath, lips), the level rises when the pitch moves toward the
  // peak and falls when it moves away. Near the peak ln(level) ~ a - (c - c_r)^2 / w^2,
  // so the slope s = d ln(level) / d cents gives the offset c - c_r = -s w^2 / 2.
  // The level comes from the raw input, not the demodulated partials: the
  // demodulator's own low-pass would otherwise lower the level whenever the
  // pitch leaves the target, faking a resonance at the target note. The raw
  // level is read over the same window as the pitch, shifted by the filter's
  // group delay (4 poles: 4 / (2 pi fc)), so the two line up in time.
  function shortPitch() {
    let best = -1, bestA = 0;
    for (let k = 0; k < PARTIALS; k++) {
      if (band[k].hist.length >= 30 && band[k].amp > bestA) { best = k; bestA = band[k].amp; }
    }
    if (best < 0) return null;
    const h = band[best].hist.slice(-26);
    const st = slopeStats(h);
    if (!st) return null;
    // a glitch (pop, tongue noise) shows up as a poor line fit: skip it
    if ((1200 / Math.LN2) * st.se / (2 * Math.PI * MULT[best] * f0) > 2) return null;
    const c = 1200 * Math.log2(Math.max(1e-6, 1 + st.slope / (2 * Math.PI) / (MULT[best] * f0)));
    const delay = 4 / (2 * Math.PI * Math.min(0.2 * f0, 200));
    const t1 = h[0].t - delay, t2 = h[h.length - 1].t - delay;
    let sa = 0, n = 0;
    for (let i = rmsHist.length - 1; i >= 0 && rmsHist[i].t >= t1; i--) {
      if (rmsHist[i].t <= t2) { sa += rmsHist[i].a; n++; }
    }
    return n ? { c, a: sa / n } : null;
  }

  function centerEstimate(now) {
    const sp = shortPitch();
    if (sp && Math.abs(sp.c) < 60) wob.push({ t: now / 1000, c: sp.c, a: sp.a });
    while (wob.length && now / 1000 - wob[0].t > 4) wob.shift();
    const n = wob.length;
    if (n < 90) return;
    // high-pass both series (subtract a 0.7 s moving average): breath swells
    // are slow, while the resonance acts on every fast wobble as well
    const half = 0.35;
    const cs = [0], as = [0];
    for (const w of wob) { cs.push(cs[cs.length - 1] + w.c); as.push(as[as.length - 1] + w.a); }
    let lo = 0, hi = 0, scc = 0, sca = 0, saa = 0, m = 0;
    for (let i = 0; i < n; i++) {
      const t = wob[i].t;
      if (t - wob[0].t < half || wob[n - 1].t - t < half) continue;
      while (wob[lo].t < t - half) lo++;
      while (hi < n && wob[hi].t <= t + half) hi++;
      const cnt = hi - lo;
      const dc = wob[i].c - (cs[hi] - cs[lo]) / cnt;
      const da = wob[i].a - (as[hi] - as[lo]) / cnt;
      if (Math.abs(dc) > 10 || Math.abs(da) > 1) continue; // outlier
      scc += dc * dc; sca += dc * da; saa += da * da; m++;
    }
    // need the pitch to have actually wobbled
    if (m < 40 || scc / m < 0.4) return;
    const slope = sca / scc;
    // neighbouring samples overlap (70 ms windows at ~60 fps), so count the
    // effective number of independent samples as about a fifth
    const se2 = Math.sqrt(Math.max(0, saa - slope * sca) / (m / 5 - 1) / scc);
    const d = Math.max(-40, Math.min(40, -slope * CENTER_WIDTH * CENTER_WIDTH / 2));
    const se = se2 * CENTER_WIDTH * CENTER_WIDTH / 2;
    if (se > 6) return; // not enough evidence yet
    center = center ? { d: center.d + (d - center.d) * 0.015, se } : { d, se };
  }

  // ---------- tuning-slide guide (tuba mode) ----------
  // Pulling the main slide out by x lengthens the tube by 2x. With an acoustic
  // length L = v / (2 f_pedal), the pitch drops by 1200*log2(1 + 2x/L) cents,
  // about 0.6 cents per mm on a B-flat tuba. A measured value replaces it.
  function slideSensitivity() {
    if (settings.slideK) return { k: settings.slideK, measured: true };
    const L = 344 / (2 * midiToFreq(TUBA_PEDAL[settings.tubaKey] || 22));
    return { k: (1200 / Math.LN2) * (2 / (L * 1000)), measured: false };
  }

  function guideText(cents) {
    if (!isTuba() || cents === null) return '';
    let c = cents, note = '';
    if (center && settings.centerCorrect) {
      if (Math.abs(center.d) >= 3) {
        note = '響きの中心より ' + Math.abs(center.d).toFixed(0) + '¢ ' + (center.d < 0 ? '低く' : '高く') + '吹いています';
        c = cents - center.d; // the horn's own pitch, not the lipped one
      } else {
        note = '響きの中心で鳴っています';
      }
    }
    const mm = c / slideSensitivity().k;
    const slide = Math.abs(mm) < 1 ? 'チューニング管：このままでOK'
      : 'チューニング管を ' + Math.abs(mm).toFixed(0) + ' mm ' + (mm > 0 ? '抜く' : '入れる');
    return note ? slide + '\n' + note : slide;
  }

  // 1-D Kalman filter over the fused reading. Consecutive readings share most
  // of their window, so their variance is inflated; a jump far outside the
  // expected spread (a peg turn) resets the filter instead of being smoothed.
  function track(z, now) {
    if (!z) return kal.x;
    const R = z.v * 8 + 0.004 * 0.004;
    if (kal.x === null || Math.abs(z.c - kal.x) > 4 * Math.sqrt(kal.P + R) + 1) {
      kal.x = z.c; kal.P = R;
    } else {
      kal.P += 0.03 * 0.03;
      const K = kal.P / (kal.P + R);
      kal.x += K * (z.c - kal.x);
      kal.P *= 1 - K;
    }
    // narrow the demodulator once the note is close and steady
    if (Math.abs(kal.x) < 6) {
      if (!lockSince) lockSince = now;
      // tuba mode stays wide so the short-time pitch can follow the natural wobble
      if (now - lockSince > 500 && !isTuba()) setNarrow(true);
    } else {
      lockSince = 0;
      if (Math.abs(kal.x) > 12) setNarrow(false);
    }
    return kal.x;
  }

  function gateLevels() {
    // sensitivity 0..100 -> rms gate ~0.03 .. ~0.0005
    const s = settings.sens / 100;
    const hi = 0.03 * Math.pow(0.0167, s);
    return [hi * 0.35, hi];
  }

  // ---------- coarse pitch (YIN) for automatic note selection ----------
  let yinBuf = null, yinDiff = null;
  function yin(buf, sr) {
    const tauMax = Math.min(Math.floor(sr / 26), buf.length >> 1);
    const tauMin = Math.floor(sr / 4500);
    const W = buf.length - tauMax;
    if (!yinDiff || yinDiff.length < tauMax + 1) yinDiff = new Float32Array(tauMax + 1);
    const d = yinDiff;
    d[0] = 1;
    let running = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let i = 0; i < W; i++) { const v = buf[i] - buf[i + tau]; s += v * v; }
      running += s;
      d[tau] = running > 0 ? (s * tau) / running : 1;
    }
    const thr = 0.15;
    for (let tau = Math.max(2, tauMin); tau < tauMax; tau++) {
      if (d[tau] < thr) {
        while (tau + 1 < tauMax && d[tau + 1] < d[tau]) tau++;
        const a = d[tau - 1], b = d[tau], c = d[tau + 1];
        const den = a - 2 * b + c;
        const shift = den !== 0 ? 0.5 * (a - c) / den : 0;
        return sr / (tau + shift);
      }
    }
    return null;
  }

  function detectNote() {
    if (!running || settings.mode !== 'auto') return;
    if (!yinBuf) yinBuf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(yinBuf);
    let s = 0;
    for (let i = 0; i < yinBuf.length; i++) s += yinBuf[i] * yinBuf[i];
    const rms = Math.sqrt(s / yinBuf.length);
    const now = performance.now();
    if (rms < gateLevels()[1]) return;
    const f = yin(yinBuf, ac.sampleRate);
    if (!f) return;
    const m = 69 + 12 * Math.log2(f / settings.a4);
    const cand = Math.round(m);
    if (cand < MIDI_MIN || cand > MIDI_MAX) return;
    const silentFor = now - lastSignalTime;
    lastSignalTime = now;
    if (targetMidi === null || silentFor > 600) { switchCount = 0; setTarget(cand); return; }
    if (cand !== targetMidi && Math.abs(m - targetMidi) > 0.65) {
      if (++switchCount >= 2) { switchCount = 0; setTarget(cand); }
    } else {
      switchCount = 0;
    }
  }

  // ---------- strobe rendering ----------
  const LUT_N = 1024;
  const lut = new Float32Array(LUT_N);
  for (let i = 0; i < LUT_N; i++) {
    // soft-edged square wave: lit segment / dark gap like a printed disc
    lut[i] = 0.5 + 0.5 * Math.tanh(4.5 * Math.cos((2 * Math.PI * i) / LUT_N));
  }

  const rowCanvas = document.createElement('canvas');
  const rowCtx = rowCanvas.getContext('2d');
  let rowImg = null;
  let W = 0, H = 0, dpr = 1;

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width * dpr));
    H = Math.max(1, Math.round(r.height * dpr));
    canvas.width = W; canvas.height = H;
    rowCanvas.width = W; rowCanvas.height = BANDS;
    rowImg = rowCtx.createImageData(W, BANDS);
  }
  new ResizeObserver(resize).observe(canvas);

  function frame() {
    requestAnimationFrame(frame);
    if (!rowImg) return;

    const [gLo, gHi] = gateLevels();
    const gate = running ? Math.max(0, Math.min(1, (lastRms - gLo) / (gHi - gLo))) : 0;
    const total = Math.SQRT2 * Math.max(lastRms, 1e-9);
    const [col, dim] = THEMES[settings.theme] || THEMES.blue;
    const data = rowImg.data;
    const basePeriods = 3;

    for (let k = 0; k < PARTIALS; k++) {
      const b = band[k];
      const target = gate * Math.min(1, Math.pow((b.amp / total) * 4, 0.5));
      b.clarity += (target - b.clarity) * 0.2;
    }

    for (let row = 0; row < BANDS; row++) {
      const k = SHOW[row];
      const b = band[k];

      // all phases seen this frame are averaged, which reproduces the smear
      // a real strobe shows when the pattern moves faster than the eye follows
      let ph = b.pending.length ? b.pending : [b.last];
      if (ph.length > 10) {
        const step = ph.length / 10, pick = [];
        for (let i = 0; i < 10; i++) pick.push(ph[Math.floor(i * step)]);
        ph = pick;
      }
      const offs = ph.map((p) => p / (2 * Math.PI));

      const L = W / (basePeriods * MULT[k]);
      const invL = 1 / L;
      const n = offs.length;
      const c = b.clarity;
      let o = row * W * 4;
      for (let x = 0; x < W; x++) {
        let s = 0;
        const ux = x * invL;
        for (let j = 0; j < n; j++) {
          let u = ux - offs[j];
          u -= Math.floor(u);
          s += lut[(u * LUT_N) | 0];
        }
        const v = s / n;
        // unlit segments glow faintly, lit ones fully; both fade with the signal
        data[o]     = c * (dim[0] + (col[0] - dim[0]) * v);
        data[o + 1] = c * (dim[1] + (col[1] - dim[1]) * v);
        data[o + 2] = c * (dim[2] + (col[2] - dim[2]) * v);
        data[o + 3] = 255;
        o += 4;
      }
    }
    for (const b of band) b.pending = [];
    rowCtx.putImageData(rowImg, 0, 0);

    g.fillStyle = '#000';
    g.fillRect(0, 0, W, H);
    g.imageSmoothingEnabled = false;
    const gap = Math.max(1, Math.round(2 * dpr));
    const bh = (H - gap * (BANDS - 1)) / BANDS;
    for (let row = 0; row < BANDS; row++) {
      g.drawImage(rowCanvas, 0, row, W, 1, 0, Math.round(row * (bh + gap)), W, Math.round(bh));
    }
    if (settings.showPartials && running) {
      const fs = Math.round(Math.min(15 * dpr, bh * 0.22));
      g.font = `600 ${fs}px "Helvetica Neue", Arial, sans-serif`;
      g.textAlign = 'right';
      g.textBaseline = 'top';
      for (let row = 0; row < BANDS; row++) {
        const k = SHOW[row];
        const pk = partial[k];
        const y0 = Math.round(row * (bh + gap)) + 6 * dpr;
        const label = '×' + MULT[k] + (pk ? '  ' + (pk.c >= 0 ? '+' : '−') + Math.abs(pk.c).toFixed(1) + '¢' : '');
        const tw = g.measureText(label).width;
        g.fillStyle = 'rgba(0,0,0,0.55)';
        g.fillRect(W - tw - 16 * dpr, y0 - 3 * dpr, tw + 10 * dpr, fs + 6 * dpr);
        g.fillStyle = pk ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)';
        g.fillText(label, W - 11 * dpr, y0);
      }
      g.textAlign = 'left';
    }

    updateReadout(gate);
  }

  function updateReadout(gate) {
    const now = performance.now();
    const active = running && gate > 0.3;
    $('note').classList.toggle('idle', !active || targetMidi === null);
    const cents = active ? track(fuse(), now) : null;
    if (!active) { lockSince = 0; for (let k = 0; k < PARTIALS; k++) partial[k] = null; wob = []; }
    else if (isTuba()) centerEstimate(now);
    $('guide').textContent = guideText(cents);
    if (cents !== null) trace.push({ t: now, c: cents });
    while (trace.length && now - trace[0].t > 8000) trace.shift();

    $('readout').classList.toggle('idle', cents === null);
    if (cents === null) {
      $('cents').textContent = '0.0';
      $('stab').textContent = '';
      $('freqInfo').textContent = f0.toFixed(2) + ' / --- Hz';
    } else {
      const r = Math.round(cents * 10) / 10;
      $('cents').textContent = (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(1);
      $('freqInfo').textContent = f0.toFixed(2) + ' / ' + (f0 * Math.pow(2, cents / 1200)).toFixed(3) + ' Hz';
      // stability: spread of the reading over the last second
      let n = 0, s = 0, ss = 0;
      for (let i = trace.length - 1; i >= 0 && now - trace[i].t < 1000; i--) { n++; s += trace[i].c; ss += trace[i].c * trace[i].c; }
      const sd = n > 10 ? Math.sqrt(Math.max(0, ss / n - (s / n) * (s / n))) : null;
      $('stab').textContent = sd === null ? '' : '±' + (sd < 0.1 ? sd.toFixed(2) : sd.toFixed(1));
    }
    const sk = slideSensitivity();
    $('slideK').textContent = sk.k.toFixed(2) + ' ¢/mm（' + (sk.measured ? '実測' : '理論値') + '）';
    $('inharmInfo').textContent = inharmB === null ? '---' : (inharmB * 1e4).toFixed(2) + ' ×10⁻⁴';
    drawTrace(now);
  }

  // ---------- history graph ----------
  const tCanvas = $('trace');
  const tg = tCanvas.getContext('2d');
  function drawTrace(now) {
    if (!settings.showTrace) return;
    const r = tCanvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (tCanvas.width !== w || tCanvas.height !== h) { tCanvas.width = w; tCanvas.height = h; }
    tg.clearRect(0, 0, w, h);
    // compressed scale: fine detail near zero, still shows +-25 cents
    const y = (c) => h / 2 - Math.sign(c) * Math.sqrt(Math.min(Math.abs(c), 25) / 25) * (h / 2 - 3 * dpr);
    tg.font = `${Math.round(10 * dpr)}px "Helvetica Neue", Arial, sans-serif`;
    tg.textBaseline = 'middle';
    for (const c of [-10, -2, 2, 10]) {
      tg.fillStyle = 'rgba(255,255,255,0.08)';
      tg.fillRect(0, Math.round(y(c)), w, Math.max(1, dpr | 0));
      tg.fillStyle = 'rgba(255,255,255,0.35)';
      tg.fillText((c > 0 ? '+' : '−') + Math.abs(c), 4 * dpr, y(c));
    }
    tg.fillStyle = 'rgba(255,255,255,0.3)';
    tg.fillRect(0, Math.round(h / 2), w, Math.max(1, dpr | 0));
    if (trace.length < 2) return;
    const accent = (THEMES[settings.theme] || THEMES.blue)[0];
    tg.strokeStyle = `rgb(${accent})`;
    tg.lineWidth = 2 * dpr;
    tg.lineJoin = 'round';
    tg.beginPath();
    let prev = null;
    for (const p of trace) {
      const x = w - ((now - p.t) / 8000) * w;
      if (prev && p.t - prev.t > 200) { tg.stroke(); tg.beginPath(); prev = null; }
      if (prev) tg.lineTo(x, y(p.c)); else tg.moveTo(x, y(p.c));
      prev = p;
    }
    tg.stroke();
  }

  // ---------- audio setup ----------
  async function ensureContext() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC({ latencyHint: 'interactive' });
    }
    if (ac.state !== 'running') await ac.resume();
    return ac;
  }

  async function ensureStrobe() {
    if (strobeNode) return;
    try {
      await ac.audioWorklet.addModule('strobe-worklet.js');
    } catch (_) {
      // some sandboxed hosts refuse a direct module URL; retry through a blob
      const src = await (await fetch('strobe-worklet.js')).text();
      await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    }
    strobeNode = new AudioWorkletNode(ac, 'strobe-processor', { numberOfInputs: 1, numberOfOutputs: 0 });
    strobeNode.port.onmessage = (e) => onBlock(e.data);
  }

  // kind: 'mic' | 'demo' | 'file'
  async function startInput(kind, file) {
    $('err').textContent = '';
    stopInput();
    try {
      await ensureContext();
      await ensureStrobe();
      strobeNode.port.postMessage({ f0 });
      analyser = ac.createAnalyser();
      analyser.fftSize = 4096;
      let node;
      if (kind === 'mic') {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('このページではマイクが使えません。HTTPS で開いてください。');
        }
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        });
        node = ac.createMediaStreamSource(micStream);
      } else if (kind === 'demo') {
        node = isTuba() ? makeTubaDemo() : makeDemo();
      } else {
        const buf = await ac.decodeAudioData(await file.arrayBuffer());
        const src = ac.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        src.start();
        const out = ac.createGain();
        out.gain.value = 0.8;
        src.connect(out).connect(ac.destination);
        extraNodes.push(src, out);
        node = src;
      }
      inputNode = node;
      node.connect(strobeNode);
      node.connect(analyser);
      running = kind;
      $('hint').hidden = true;
      updateInputButtons();
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
    } catch (e) {
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      $('err').textContent = denied
        ? 'マイクの使用が許可されていません。デモかファイルで試せます。'
        : '開始できませんでした: ' + (e.message || e.name);
      stopInput();
    }
  }

  // a plucked-string-like tone whose pitch drifts slowly around A2,
  // so the bands speed up, slow down, stop and reverse
  function makeDemo() {
    const osc = ac.createOscillator();
    const n = 9, re = new Float32Array(n), im = new Float32Array(n);
    for (let h = 1; h < n; h++) im[h] = 1 / Math.pow(h, 1.3);
    osc.setPeriodicWave(ac.createPeriodicWave(re, im));
    osc.frequency.value = 110;
    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.07;
    const depth = ac.createGain();
    depth.gain.value = 14; // cents
    lfo.connect(depth).connect(osc.detune);
    const level = ac.createGain();
    level.gain.value = 0.3;
    osc.connect(level);
    osc.start(); lfo.start();
    extraNodes.push(osc, lfo, depth, level);
    return level;
  }

  // Synthetic B-flat tuba note (concert B-flat 1): the fundamental is weak, as
  // a small mic hears it; the player sits 10 cents below the horn's resonance
  // (played at +5, horn centred at +15) and the note wobbles naturally, so
  // the level follows the resonance curve as the pitch moves.
  function makeTubaDemo() {
    const sr = ac.sampleRate, dur = 10, n = sr * dur;
    const buf = ac.createBuffer(1, n, sr);
    const out = buf.getChannelData(0);
    const fBase = midiToFreq(34);
    const amps = [0.06, 0.5, 0.6, 0.45, 0.35, 0.25, 0.18, 0.12];
    const cents = (t) => 5 + 2.5 * Math.sin(2 * Math.PI * 4.3 * t) + 1.2 * Math.sin(2 * Math.PI * 1.7 * t + 1);
    // total phase over the loop, rounded to whole cycles so the loop is seamless
    let total = 0;
    for (let i = 0; i < n; i++) total += 2 * Math.PI * fBase * Math.pow(2, cents(i / sr) / 1200) / sr;
    const fix = (Math.round(total / (2 * Math.PI)) * 2 * Math.PI) / total;
    let phase = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      const c = cents(t);
      const u = (c - 15) / 25;
      const level = (0.8 + 0.2 * Math.sin(2 * Math.PI * 0.1 * t)) / Math.sqrt(1 + u * u);
      let v = 0;
      for (let k = 0; k < amps.length; k++) v += amps[k] * Math.sin((k + 1) * phase + k);
      out[i] = 0.25 * level * v;
      phase += fix * 2 * Math.PI * fBase * Math.pow(2, c / 1200) / sr;
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.start();
    extraNodes.push(src);
    return src;
  }

  function stopInput() {
    running = false;
    if (inputNode) { try { inputNode.disconnect(); } catch (_) {} inputNode = null; }
    for (const n of extraNodes) { try { n.stop?.(); } catch (_) {} try { n.disconnect(); } catch (_) {} }
    extraNodes = [];
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    $('hint').hidden = false;
    updateInputButtons();
    try { wakeLock?.release(); } catch (_) {}
    wakeLock = null;
  }

  function updateInputButtons() {
    $('micBtn').classList.toggle('on', running === 'mic');
    $('demoBtn').classList.toggle('on', running === 'demo');
    $('fileBtn').classList.toggle('on', running === 'file');
  }

  async function toggleRef() {
    if (refOsc) {
      const o = refOsc, gn = refGain;
      refOsc = null; refGain = null;
      gn.gain.setTargetAtTime(0, ac.currentTime, 0.03);
      setTimeout(() => { o.stop(); o.disconnect(); gn.disconnect(); }, 250);
      $('refBtn').classList.remove('on');
      return;
    }
    await ensureContext();
    if (targetMidi === null) setTarget(69);
    refOsc = ac.createOscillator();
    refOsc.type = settings.wave;
    refOsc.frequency.value = f0;
    refGain = ac.createGain();
    refGain.gain.value = 0;
    refOsc.connect(refGain).connect(ac.destination);
    refOsc.start();
    refGain.gain.setTargetAtTime(refLevel(), ac.currentTime, 0.03);
    $('refBtn').classList.add('on');
  }
  const refLevel = () => Math.pow(settings.vol / 100, 2) * (settings.wave === 'sine' ? 0.6 : 0.3);

  // ---------- controls ----------
  $('micBtn').addEventListener('click', () => (running === 'mic' ? stopInput() : startInput('mic')));
  $('demoBtn').addEventListener('click', () => (running === 'demo' ? stopInput() : startInput('demo')));
  $('fileBtn').addEventListener('click', () => (running === 'file' ? stopInput() : $('fileIn').click()));
  $('fileIn').addEventListener('change', () => {
    const f = $('fileIn').files[0];
    if (f) startInput('file', f);
    $('fileIn').value = '';
  });
  $('refBtn').addEventListener('click', toggleRef);

  for (const b of document.querySelectorAll('[data-mode]')) {
    b.addEventListener('click', () => {
      settings.mode = b.dataset.mode;
      if (settings.mode === 'manual') setTarget(targetMidi ?? settings.manualMidi);
      save(); renderNote();
    });
  }

  function stepNote(d) {
    settings.mode = 'manual';
    setTarget((targetMidi ?? settings.manualMidi) + d);
    settings.manualMidi = targetMidi;
    save(); renderNote();
  }

  function stepCal(d) {
    settings.a4 = Math.round(Math.max(400, Math.min(480, settings.a4 + d)) * 10) / 10;
    save();
    if (targetMidi !== null) setTarget(targetMidi); else renderNote();
  }

  // press-and-hold repeat for steppers
  function holdRepeat(el, fn) {
    let timer = null, count = 0;
    const stop = () => { clearTimeout(timer); timer = null; };
    const tick = () => { fn(count++); timer = setTimeout(tick, count > 8 ? 50 : 140); };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); count = 0; fn(count++); timer = setTimeout(tick, 400); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, stop));
  }
  holdRepeat($('noteDown'), () => stepNote(-1));
  holdRepeat($('noteUp'), () => stepNote(1));
  holdRepeat($('calDown'), (n) => stepCal(n > 15 ? -1 : -0.1));
  holdRepeat($('calUp'), (n) => stepCal(n > 15 ? 1 : 0.1));
  $('setBtn').addEventListener('click', () => {
    $('panel').hidden = !$('panel').hidden;
    $('setBtn').classList.toggle('on', !$('panel').hidden);
  });
  $('calVal').addEventListener('dblclick', () => stepCal(440 - settings.a4));

  const sens = $('sens'), vol = $('vol'), wave = $('wave');
  sens.value = settings.sens; vol.value = settings.vol; wave.value = settings.wave;
  sens.addEventListener('input', () => { settings.sens = +sens.value; save(); });
  vol.addEventListener('input', () => {
    settings.vol = +vol.value; save();
    if (refGain) refGain.gain.setTargetAtTime(refLevel(), ac.currentTime, 0.02);
  });
  wave.addEventListener('change', () => {
    settings.wave = wave.value; save();
    if (refOsc) { refOsc.type = settings.wave; refGain.gain.setTargetAtTime(refLevel(), ac.currentTime, 0.02); }
  });

  function renderOptions() {
    for (const b of document.querySelectorAll('[data-acc]')) b.classList.toggle('on', b.dataset.acc === settings.notation);
    for (const b of document.querySelectorAll('[data-inst]')) b.classList.toggle('on', b.dataset.inst === settings.instrument);
    for (const b of document.querySelectorAll('[data-key]')) b.classList.toggle('on', b.dataset.key === settings.tubaKey);
    for (const el of document.querySelectorAll('.tuba-only')) el.hidden = !isTuba();
    for (const el of document.querySelectorAll('.general-only')) el.hidden = isTuba();
    for (const b of document.querySelectorAll('[data-opt]')) b.classList.toggle('on', !!settings[b.dataset.opt] === (b.dataset.v === '1'));
    $('traceWrap').hidden = !settings.showTrace;
  }
  const NOTATIONS = ['sharp', 'flat', 'german'];
  function setNotation(n) { settings.notation = n; save(); renderOptions(); renderNote(); }
  for (const b of document.querySelectorAll('[data-acc]')) b.addEventListener('click', () => setNotation(b.dataset.acc));
  $('note').addEventListener('click', () => setNotation(NOTATIONS[(NOTATIONS.indexOf(settings.notation) + 1) % 3]));
  for (const b of document.querySelectorAll('[data-inst]')) {
    b.addEventListener('click', () => {
      settings.instrument = b.dataset.inst;
      setNarrow(false);
      if (isTuba() && settings.notation === 'sharp') settings.notation = 'german';
      wob = []; center = null;
      save(); renderOptions(); renderNote();
    });
  }
  for (const b of document.querySelectorAll('[data-key]')) {
    b.addEventListener('click', () => { settings.tubaKey = b.dataset.key; settings.slideK = null; save(); renderOptions(); });
  }

  // measure the slide: same note before and after pulling the slide a known amount
  let calib = null;
  function currentSteady() {
    const now = performance.now();
    const recent = trace.filter((p) => now - p.t < 1000);
    if (recent.length < 20 || kal.x === null) return null;
    const m = recent.reduce((a, p) => a + p.c, 0) / recent.length;
    const sd = Math.sqrt(recent.reduce((a, p) => a + (p.c - m) * (p.c - m), 0) / recent.length);
    return sd < 2 ? m : null;
  }
  $('calibBtn').addEventListener('click', () => {
    const c = currentSteady();
    if (c === null) { $('calibText').textContent = '音が安定してから押してください'; return; }
    if (!calib) {
      calib = { c1: c, midi: targetMidi };
      $('calibText').textContent = '管を ' + (+$('calibMm').value || 10) + ' mm 抜いて、同じ音を吹いて「記録」';
      return;
    }
    const mm = +$('calibMm').value || 10;
    if (targetMidi !== calib.midi) { $('calibText').textContent = '1回目と同じ音で吹いてください'; return; }
    const k = (calib.c1 - c) / mm;
    calib = null;
    if (k < 0.05 || k > 5) { $('calibText').textContent = '変化がはっきりしませんでした。もう一度「記録」から'; return; }
    settings.slideK = k; save();
    $('calibText').textContent = '測定しました：' + k.toFixed(2) + ' ¢/mm';
  });
  $('calibReset').addEventListener('click', () => {
    settings.slideK = null; calib = null; save();
    $('calibText').textContent = '理論値に戻しました';
  });
  for (const b of document.querySelectorAll('[data-opt]')) {
    b.addEventListener('click', () => {
      settings[b.dataset.opt] = b.dataset.v === '1';
      save(); renderOptions();
    });
  }
  renderOptions();

  const colors = $('colors');
  for (const [name, rgb] of Object.entries(THEMES)) {
    const s = document.createElement('button');
    s.className = 'swatch' + (settings.theme === name ? ' on' : '');
    s.style.background = `rgb(${rgb[0]})`;
    s.setAttribute('aria-label', name);
    s.addEventListener('click', () => {
      settings.theme = name; save();
      for (const el of colors.querySelectorAll('.swatch')) el.classList.toggle('on', el === s);
      applyTheme();
    });
    colors.appendChild(s);
  }
  function applyTheme() {
    document.documentElement.style.setProperty('--accent', `rgb(${(THEMES[settings.theme] || THEMES.blue)[0]})`);
  }

  // iOS suspends audio when the page is backgrounded
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      if (ac && ac.state !== 'running') { try { await ac.resume(); } catch (_) {} }
      if (running && !wakeLock) { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {} }
    } else {
      wakeLock = null;
    }
  });

  applyTheme();
  if (targetMidi !== null) setTarget(targetMidi); else renderNote();
  setInterval(detectNote, 90);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
