<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VELOCITY RUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="flash"></div>
  <div id="vignette"></div>
  <div class="hud-top">
    <div class="hud-dist"><span id="dist">0</span><small>m</small></div>
    <div class="hud-score"><div id="score">0</div><div id="mult">x1.0</div></div>
  </div>
  <div id="biome-banner"><div class="bb-sector" id="bb-sector">SECTOR 01</div><div class="bb-name" id="bb-name">SKYLINE</div><div class="bb-jp" id="bb-jp">屋上都市</div></div>
  <div id="popups"></div>
  <div class="hud-bottom">
    <div class="speedo">
      <div class="speed-num"><span id="speed">0</span><small>km/h</small></div>
      <div class="speed-bar"><div id="speed-fill"></div></div>
    </div>
    <div class="flow">
      <div class="flow-label">FLOW <span id="flow-hint">— 満タンで [E] / 右クリック: OVERDRIVE</span></div>
      <div class="flow-bar"><div id="flow-fill"></div></div>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="touch"></div>
</div>

<div id="title" class="screen">
  <div class="title-inner">
    <div class="logo">VELOCITY<span>RUN</span></div>
    <div class="tag">一人称パルクール・エンドレスラン</div>
    <div id="loading"><div class="ld-bar"><div id="ld-fill"></div></div><div id="ld-text">LOADING ASSETS…</div></div>
    <button id="start" class="btn hidden">CLICK TO RUN</button>
    <div class="controls">
      <div><kbd>A</kbd><kbd>D</kbd> 左右移動</div>
      <div><kbd>Space</kbd> ジャンプ / 壁キック</div>
      <div><kbd>Shift</kbd> <kbd>C</kbd> スライディング（着地時=受け身）</div>
      <div><kbd>Mouse</kbd> 視点</div>
      <div><kbd>E</kbd> / 右クリック OVERDRIVE</div>
      <div>空中で壁に寄ると <b>ウォールラン</b></div>
    </div>
    <div class="best">BEST <span id="best">0</span> m</div>
    <a class="credits-link" href="./CREDITS.html" target="_blank">素材クレジット</a>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="title-inner">
    <div class="logo small">PAUSED</div>
    <button id="resume" class="btn">CLICK TO RESUME</button>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="title-inner">
    <div class="logo small" id="over-reason">WIPEOUT</div>
    <div class="results">
      <div><label>DISTANCE</label><b id="r-dist">0 m</b></div>
      <div><label>TOP SPEED</label><b id="r-top">0 km/h</b></div>
      <div><label>SCORE</label><b id="r-score">0</b></div>
      <div><label>SECTOR</label><b id="r-sector">-</b></div>
    </div>
    <div id="r-best" class="newbest hidden">NEW BEST!</div>
    <button id="retry" class="btn">RETRY [R]</button>
  </div>
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
