<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなのため</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&display=swap">
<style>
/* layout: 暗い余白の中央に一台のスマホ。中はトーク一覧 ⇄ トーク画面。単一の見た目で固定（テーマ切替なし） */
:root{
  color-scheme:dark;
  --void:#0c0c0e; --frame:#1c1c1f;
  --chat-bg:rgb(140,171,216); --ink:#1d2a3a; --meta:#34445b;
  --bubble:#ffffff; --mine:#8de055; --line-green:#06c755;
  --sheet:#ffffff; --sheet-ink:#111418; --sheet-sub:#8a8f98; --sheet-rule:#eceef1; --field:#f2f3f5;
  --pill:rgba(0,0,0,.17); --alert:#e0332c;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--void);font-family:var(--body);-webkit-font-smoothing:antialiased;color:var(--sheet-ink);display:flex;justify-content:center;align-items:center}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,.li:focus-visible{outline:2px solid var(--line-green);outline-offset:2px}
#app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--chat-bg);display:flex;flex-direction:column;transition:background-color 5s ease}
@media (min-width:520px) and (min-height:700px){
  #app{height:min(880px,calc(100% - 40px));border-radius:30px;box-shadow:0 0 0 9px var(--frame),0 0 0 10px #333,0 30px 80px #000}
}

/* ---------- room view ---------- */
header{flex:none;display:flex;align-items:center;gap:6px;padding:10px 10px;color:var(--ink);background:rgba(255,255,255,.06);border-bottom:1px solid rgba(0,0,0,.06);z-index:2;transition:color 5s}
.back{display:flex;align-items:center;gap:3px;font-size:24px;min-width:58px;height:28px}
.badge{font-size:11.5px;font-weight:700;min-width:18px;padding:0 5px;height:18px;line-height:18px;border-radius:9px;background:var(--ink);color:var(--chat-bg);text-align:center}
.title{flex:1;text-align:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hicons{display:flex;gap:10px;min-width:58px;justify-content:flex-end}
.hicons button{font-size:15px;opacity:.55;width:24px;height:24px;display:grid;place-items:center}
.hicons button.on{opacity:1}
#chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 18px;-webkit-overflow-scrolling:touch}
.pill{width:fit-content;max-width:86%;margin:12px auto;padding:3px 11px;border-radius:12px;background:var(--pill);color:#fff;font-size:11px;text-align:center;line-height:1.5}
.row{display:flex;margin-top:9px}
.row.live{animation:pop .22s ease-out}
.row.cont{margin-top:3px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.cont .av{visibility:hidden;height:0}
.body{margin-left:8px;max-width:74%;min-width:0}
.name{font-size:11px;color:var(--meta);margin:1px 0 3px 3px}
.cont .name{display:none}
.line{display:flex;align-items:flex-end;gap:5px}
.bubble{position:relative;background:var(--bubble);color:#111;border-radius:18px;padding:8px 12px;font-size:15px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.other:not(.cont) .bubble::before{content:"";position:absolute;left:-5px;top:2px;width:14px;height:14px;background:var(--bubble);border-bottom-right-radius:14px;clip-path:polygon(0 0,100% 0,100% 100%)}
.meta{font-size:10px;color:var(--meta);white-space:nowrap;line-height:1.25;flex:none}
.self{justify-content:flex-end}
.self .body{max-width:76%}
.self .line{justify-content:flex-end}
.self .bubble{background:var(--mine)}
.self:not(.cont) .bubble::after{content:"";position:absolute;right:-5px;top:2px;width:14px;height:14px;background:var(--mine);border-bottom-left-radius:14px;clip-path:polygon(0 0,100% 0,0 100%)}
.self .meta{text-align:right}
.stamp{font-size:66px;line-height:1.05}
#app.dark .meta,#app.dark .name{color:rgba(255,255,255,.72)}
#app.dark header{color:#e8ecf2}
#app.dark .badge{background:#e8ecf2}

footer{flex:none;display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--sheet);z-index:2}
footer svg{width:24px;height:24px;stroke:#444;fill:none;stroke-width:1.7;flex:none}
#msg{flex:1;min-width:0;height:36px;border-radius:18px;border:none;background:var(--field);color:#111;padding:0 14px;font-size:16px;outline:none;font-family:inherit;color-scheme:light}
#msg:disabled{color:var(--sheet-sub)}
#send{width:30px;height:30px;display:grid;place-items:center}
#send svg{stroke:var(--line-green);stroke-width:2}
#send:disabled svg{stroke:#bbb}

/* ---------- list view ---------- */
#list{position:absolute;inset:0;z-index:5;background:var(--sheet);display:flex;flex-direction:column}
#list[hidden]{display:none}
.lh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-weight:800;font-size:21px}
.lh span{font-size:12px;font-weight:400;color:var(--sheet-sub)}
.tabs{display:flex;gap:16px;padding:0 16px 8px;font-size:13px;color:var(--sheet-sub);border-bottom:1px solid var(--sheet-rule)}
.tabs b{color:var(--sheet-ink);border-bottom:2px solid var(--sheet-ink);padding-bottom:6px}
#rooms{flex:1;overflow-y:auto}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left}
.li:active{background:var(--field)}
.li .av{width:50px;height:50px;font-size:18px}
.li .mid{flex:1;min-width:0}
.li .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{font-weight:400;color:var(--sheet-sub);font-size:13px}
.li .p{font-size:12.5px;color:var(--sheet-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.li .tm{font-size:11px;color:var(--sheet-sub)}
.li .ub{font-size:11px;font-weight:700;color:#fff;background:var(--line-green);min-width:20px;height:20px;line-height:20px;border-radius:10px;padding:0 6px;text-align:center}
.li.req .t{color:var(--sheet-sub)}

/* ---------- media ---------- */
.shot{width:226px;border-radius:12px;overflow:hidden;background:#8ea9cf;border:1px solid rgba(0,0,0,.18);font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.15);color:#111}
.shot-top{display:flex;justify-content:space-between;padding:3px 8px;background:#f3f3f3;color:#222;font-size:9px;font-weight:700}
.shot-head{padding:4px 8px 5px;background:#f3f3f3;border-bottom:1px solid #ddd;font-weight:700;color:#222}
.shot-body{padding:6px 7px 8px}
.srow{display:flex;gap:5px;margin-top:6px;align-items:flex-start}
.srow.s{justify-content:flex-end}
.sav{width:20px;height:20px;border-radius:50%;flex:none;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center}
.sname{font-size:8.5px;color:#334;margin-bottom:1px}
.sb{background:#fff;border-radius:10px;padding:4px 7px;line-height:1.4;white-space:pre-wrap;word-break:break-word;max-width:170px}
.s .sb{background:var(--mine)}
.srow.hl .sb{box-shadow:0 0 0 2px var(--alert)}
.shot-foot{padding:4px 8px;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;text-align:right}
.photo{width:220px;height:165px;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ph-e{font-size:40px;letter-spacing:2px;text-align:center;line-height:1.2}
.ph-c{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card{width:236px;background:#fff;color:#111;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card-h{background:#f5f5f5;padding:6px 10px;font-size:11px;color:#666;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.note-t{padding:10px 12px 4px;font-weight:700;font-size:15px}
.card ol{padding:4px 12px 8px 30px;font-size:13.5px;line-height:1.7}
.card-f{padding:6px 12px;border-top:1px solid #eee;font-size:10.5px;color:#999}
.album-g{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.album-g div{height:76px;background:#d9dde4;display:flex;align-items:flex-end;padding:5px;font-size:10px;color:#333}
.album-g div.more{background:#555;color:#fff;font-size:20px;justify-content:center;align-items:center}
.score table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.score td{padding:5px 8px}
.score td:first-child{width:52px;color:#666}
.score td:last-child{width:34px;text-align:right;font-weight:700}
.score .bar{padding:5px 0}
.score .bar span{display:block;height:8px;border-radius:4px;background:#eef0f3;overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--alert)}
.score .bar i.pass{background:#bfc5cc}
.story{width:180px;height:300px;border-radius:14px;background:linear-gradient(160deg,#3a2f4a,#7a5a6e 60%,#c79a8e);color:#fff;padding:12px;position:relative}
.story-bar{height:2px;background:rgba(255,255,255,.5);border-radius:2px;margin-bottom:8px}
.story-top{font-size:10px;opacity:.85;display:flex;align-items:center;gap:6px}
.story-top i{display:inline-block;width:18px;height:18px;border-radius:50%;background:#bbb}
.story-t{position:absolute;top:45%;left:10px;right:10px;text-align:center;font-weight:700;font-size:15px;line-height:1.5;white-space:pre-wrap}
.story-tag{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11px;opacity:.8}
.sns{width:262px;background:#fff;border-radius:14px;padding:11px 12px 8px;font-size:13px;color:#0f1419;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sns-h{display:flex;gap:8px;align-items:center}
.sns-av{width:34px;height:34px;border-radius:50%;background:#efb24a;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.sns-h b{font-size:13.5px}
.sns-h span{color:#536471;font-size:11.5px;display:block}
.sns-t{margin:8px 0;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.sns-q{background:#f7f9f9;border-left:3px solid #cfd9de;padding:6px 8px;margin:6px 0;border-radius:4px}
.blurimg{height:130px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(180deg,#a7b4c4,#6d7887)}
.blurimg .b{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font-size:76px;filter:blur(7px)}
.blurimg .cap{position:absolute;bottom:6px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.sns-s{display:flex;justify-content:space-between;color:#536471;font-size:12px;padding:8px 2px 6px;border-bottom:1px solid #eff3f4;font-variant-numeric:tabular-nums}
.sns-s .lk{color:#f91880}
.rep{display:flex;gap:7px;padding:7px 0 2px;opacity:0;animation:fadein .5s forwards}
.rep i{width:24px;height:24px;border-radius:50%;flex:none;background:#c4ccd4}
.rep div{font-size:12px;line-height:1.45}
.rep b{font-size:11.5px;display:block}
@keyframes fadein{to{opacity:1}}
.mt{width:256px;background:#fff;color:#111;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mt-site{background:#c8102e;color:#fff;font-size:11px;font-weight:700;padding:5px 10px}
.mt-title{padding:9px 10px 6px;font-weight:800;font-size:13.5px;line-height:1.45}
.mt .blurimg{margin:0 10px;height:110px;border-radius:6px}
.mt-meta{padding:6px 10px 9px;font-size:10.5px;color:#888}
.fb{width:250px;background:#fff;color:#1c1e21;border-radius:12px;overflow:hidden;font-size:12.5px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fb-top{background:#1877f2;color:#fff;font-weight:800;padding:5px 10px;font-size:13px}
.fb-post{padding:9px 10px;border-bottom:1px solid #e4e6eb;line-height:1.5}
.fb-post b{display:block;font-size:12px}
.fb-post small{color:#65676b;font-size:10.5px}
.fb-c{display:flex;gap:7px;padding:8px 10px}
.fb-c i{width:26px;height:26px;border-radius:50%;background:#efb24a;flex:none}
.fb-c div{background:#f0f2f5;border-radius:12px;padding:6px 9px;line-height:1.45}
.fb-c b{display:block;font-size:11.5px}
.fb-c a{color:#1877f2;text-decoration:none;word-break:break-all}

/* ---------- toasts ---------- */
#toasts{position:absolute;top:8px;left:0;right:0;z-index:20;pointer-events:none}
.toast{margin:0 8px 6px;padding:9px 11px;border-radius:16px;background:rgba(246,246,248,.95);color:#111;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:tin .35s ease-out;transition:opacity .5s,transform .5s;pointer-events:auto;cursor:pointer}
.toast.out{opacity:0;transform:translateY(-14px)}
@keyframes tin{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.toast .ic{width:34px;height:34px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.toast .tx{flex:1;min-width:0;font-size:13px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.toast .ap{display:flex;justify-content:space-between;font-size:11px;color:#777}
.toast b{display:block}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ov[hidden]{display:none}
#title{background:var(--void);color:#ddd;padding:28px 16px;gap:14px}
#title h1{font-family:var(--display);font-weight:500;font-size:38px;letter-spacing:.14em;color:#f2f2f2;text-wrap:balance}
#title .sub{font-size:12px;letter-spacing:.3em;color:#8a8a90;margin-top:-6px}
#title .warn{font-size:11.5px;color:#a59a9a;line-height:1.8;max-width:310px;border:1px solid #2a2a2e;padding:10px 12px;border-radius:8px}
#title label{font-size:12px;color:#999;margin-top:6px}
#pname{width:170px;text-align:center;font-size:17px;padding:8px;border-radius:10px;border:1px solid #333;background:#16161a;color:#eee;outline:none;font-family:inherit}
#start{margin-top:6px;padding:11px 40px;border-radius:24px;background:var(--line-green);color:#fff;font-weight:700;font-size:15px}
#title .hint{font-size:11px;color:#77777d;line-height:1.8}
#fade{background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s ease;color:#bbb;font-family:var(--display);font-size:17px;letter-spacing:.3em}
#fade.on{opacity:1;pointer-events:auto}
#final{background:#000;color:#fff;gap:30px}
#finalText{font-size:22px;letter-spacing:.08em;min-height:1.5em}
#finalSub{opacity:0;transition:opacity 3s;color:#666;font-size:12px;letter-spacing:.3em;display:flex;flex-direction:column;gap:22px;align-items:center;font-family:var(--display)}
#finalSub button{color:#888;border:1px solid #333;padding:7px 22px;border-radius:18px;font-size:12px;letter-spacing:.1em;font-family:var(--body)}
#choice{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:flex-end}
#choice[hidden]{display:none}
#choice .sheet{background:var(--sheet);border-radius:18px 18px 0 0;padding:18px 16px 22px;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#choice p{text-align:center;font-size:12px;color:var(--sheet-sub);margin-bottom:12px}
#choice button{display:block;width:100%;padding:14px;border-radius:12px;font-size:15px;margin-top:8px;background:var(--field)}
#choice button.leave{color:var(--alert)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn" aria-label="トーク一覧へ">‹ <span class="badge" id="badge" hidden>0</span></button>
    <div class="title" id="gtitle">いつめん🌸 (6)</div>
    <div class="hicons">
      <button id="speedBtn" title="早送り" aria-label="早送り">⏩</button>
      <button id="soundBtn" class="on" title="通知音" aria-label="通知音">🔔</button>
    </div>
  </header>
  <div id="chat"></div>
  <footer>
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
    <input id="msg" type="text" autocomplete="off" enterkeyhint="send" placeholder="メッセージを入力" maxlength="140">
    <button id="send" disabled aria-label="送信"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></svg></button>
  </footer>

  <div id="list" hidden>
    <div class="lh">トーク <span id="listMeta"></span></div>
    <div class="tabs"><b>すべて</b><span>友だち</span><span>グループ</span><span>リクエスト</span></div>
    <div id="rooms"></div>
  </div>

  <div id="toasts"></div>
  <div id="choice" hidden><div class="sheet">
    <p>いつめん🌸 (6)</p>
    <button class="leave" id="cLeave">グループを退会する</button>
    <button id="cStay">何も言わずに残る</button>
  </div></div>

  <div class="ov" id="title">
    <h1>みんなのため</h1>
    <div class="sub">グループトーク・ホラー</div>
    <div class="warn">※ 本作はフィクションです。<br>SNSでの晒し、集団によるいじめ、個人情報の拡散などの描写が含まれます。プレイ時間の目安は40〜60分です。</div>
    <label for="pname">あなたの名前</label>
    <input id="pname" value="ユイ" maxlength="6">
    <button id="start">トークをひらく</button>
    <div class="hint">メッセージは自由に入力して送信できます。<br>「‹」でトーク一覧に戻ると、ほかのトークも読めます。<br>画面をタップすると少し早く進みます。</div>
  </div>
  <div class="ov" id="fade"><div id="fadeText"></div></div>
  <div class="ov" id="final" hidden>
    <div id="finalText"></div>
    <div id="finalSub"><span>みんなのため</span><button id="again">もう一度ひらく</button></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   state
   ===================================================================== */
const S = {
  name:'ユイ', last:'', lastCat:'', log:[], count:{}, clock:0, day:'',
  awaiting:null, speed:1, sound:true, left:false, interject:[], lastInterject:0,
  sr:'group', view:'group', apps:0, seq:0,
  misakiDM:'', kanaDM:'', score1:0, score2:0,
};
const PLAYER_COLOR = '#9aa3ad';
const C = {
  misaki:{n:'ミサキ', c:'#ec8db3'}, kana:{n:'カナ', c:'#7fb2e6'}, rina:{n:'リナ', c:'#efb24a'},
  aya:{n:'アヤ', c:'#a68bd6'}, sota:{n:'ソウタ', c:'#63bf86'},
  saki:{n:'さき', c:'#d99aaa'}, yuna:{n:'ゆな', c:'#93b9d6'}, senpai:{n:'みお先輩', c:'#c9a27a'},
  mom:{n:'お母さん', c:'#e2a37f'}, tencho:{n:'店長（カフェ・ルポ）', c:'#8a7a6a'},
  x1:{n:'nanashi_0921', c:'#8c8c94'}, x2:{n:'🐈‍⬛', c:'#444'}, x3:{n:'通りすがり', c:'#9c8a8a'},
};
const ROOMS = {
  group: {title:'いつめん🌸', count:6, readers:5, icon:'🌸', iconBg:'linear-gradient(135deg,#ffb3cf,#a6c8ff)'},
  kana:  {title:'カナ', readers:1, who:'kana'},
  sota:  {title:'ソウタ', readers:1, who:'sota'},
  misaki:{title:'ミサキ', readers:1, who:'misaki'},
  tennis:{title:'テニス部 2年', count:14, readers:13, icon:'🎾', iconBg:'linear-gradient(135deg,#d9f27a,#7ec27a)'},
  mom:   {title:'お母さん', readers:1, who:'mom'},
  shop:  {title:'店長（カフェ・ルポ）', readers:1, who:'tencho'},

let skipFn = null;
function sleep(ms){
  return new Promise(r => {
    const done = () => { clearTimeout(id); if (skipFn === done) skipFn = null; r(); };
    const id = setTimeout(done, ms / S.speed);
    skipFn = done;
  });
}

const shortDay = d => d.replace(/^(\d+)月(\d+)日.*$/, '$1/$2');

let ac = null;
function tone(f, d, v, at=0){
  if (!S.sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
  }catch(e){}
}
const ding = () => { tone(1318,.09,.04); tone(988,.12,.035,.07); };
const buzz = () => { tone(440,.12,.05); tone(440,.12,.05,.16); };

/* post a message. who: character id | 'me'. opts.seed for history (time/day given) */
function post(id, who, inner, preview, opts = {}){
  const r = R[id], day = opts.day || S.day, time = opts.time || clockStr();
  ensureDay(r, day);
  if (!opts.seed && who !== 'me' && Math.random() < .35) S.clock++;
  const row = document.createElement('div');
  if (who === 'me'){
    row.className = 'row self' + (r.lastSender === 'me' ? ' cont' : '') + (opts.seed ? '' : ' live');
    row.innerHTML = `<div class="body"><div class="line"><div class="meta"><span class="rd">${opts.seed ? (r.readers > 1 ? '既読 ' + r.readers : '既読') : ''}</span><br>${time}</div>${inner}</div></div>`;
  } else {
    const c = C[who];
    row.className = 'row other' + (r.lastSender === who ? ' cont' : '') + (opts.seed ? '' : ' live');
    row.innerHTML = `<div class="av" style="background:${c.c}">${esc(ini(c.n))}</div>
      <div class="body">${r.who ? '' : `<div class="name">${esc(c.n)}</div>`}<div class="line">${inner}<div class="meta">${time}</div></div></div>`;
  }
  r.el.appendChild(row); r.lastSender = who;
  row.addEventListener('animationend', () => row.classList.remove('live'), {once:true});
  touch(r, preview, time, day);
  if (!opts.seed){
    if (S.view === id) scrollDown();
    else if (who !== 'me'){ r.unread++; msgToast(r, who, preview); }
    updateBadges();
  }
  return row;
}
function postPill(id, text, opts = {}){
  const r = R[id]; ensureDay(r, opts.day || S.day);
  const p = document.createElement('div'); p.className = 'pill'; p.textContent = text;
  r.el.appendChild(p); r.lastSender = null; touch(r, text, opts.time || clockStr(), opts.day || S.day);
  if (!opts.seed){ if (S.view === id) scrollDown(); else r.unread++; updateBadges(); }
  return p;
}

/* =====================================================================
   classify player text
   ===================================================================== */
const RULES = [
  ['plea',     /やめて|お願い|おねがい|許して|ゆるして|助けて|たすけて|消して|けして|やりすぎ|ひどい|酷い|もう無理|つらい|辛い|しんどい|勘弁|怖い|こわい/],
  ['apology',  /ごめん|ゴメン|すみません|すいません|申し訳|もうしわけ|反省|悪かった|謝/],
  ['anger',    /うるさい|うざ|ウザ|しつこい|ふざけ|黙れ|だまれ|いい加減|最低|死ね|きも|キモ|は[?？]|はぁ|ムカつ|知るか|関係ない|偽善|おかしい/],
  ['deny',     /違う|ちがう|私じゃ|わたしじゃ|俺じゃ|僕じゃ|やってない|してない|知らない|しらない|誤解|嘘じゃ|証拠|勘違い/],
  ['excuse',   /でも|だって|つい|悪気|わざと|そんなつもり|仕方|しかた|冗談|ノリ|心配で/],
  ['question', /なんで|何で|どうして|なぜ|どうしたら|どうすれば|[?？]/],
];
function classify(t){
  t = t.trim(); if (!t) return 'silence';
  for (const [k, re] of RULES) if (re.test(t)) return k;
  return t.length <= 2 ? 'short' : 'other';
}
const YES = /うん|はい|分かっ|わかっ|守る|まもる|了解|りょ|ok|OK|オッケ/;
function scoreOf(text, cat){
  if (!text.trim()) return 0;
  let s = 22 + Math.min(28, Math.floor(text.length * .9)) + (cat === 'apology' ? 12 : 0) - (cat === 'anger' ? 25 : 0) - (cat === 'excuse' ? 12 : 0);
  return Math.max(4, Math.min(71, s));
}

/* =====================================================================
   engine
   ===================================================================== */
async function run(steps){ for (const st of steps) await exec(st); }
async function exec(st){
  switch (st.t){
    case 'msg': {
      const text = fmt(resolve(st.text));
      await sleep(st.delay ?? typingDelay(text));
      post(S.sr, st.who, bubble(text), text); if (S.view === S.sr) ding(); break;
    }
    case 'date': await sleep(700); S.day = st.text; S.clock = st.time; break;
    case 'to': S.sr = st.room; break;
    case 'open': openRoom(st.room); break;
    case 'sys': await sleep(st.delay ?? 1000); postPill(S.sr, fmt(st.text)); break;
    case 'img': {
      await sleep(st.delay ?? 1500);
      const row = post(S.sr, st.who, resolve(st.html), st.preview || '画像を送信しました'); animateCounters(row);
      if (S.view === S.sr) ding(); break;
    }
    case 'stamp': await sleep(st.delay ?? 900); post(S.sr, st.who, `<div class="stamp">${st.e}</div>`, 'スタンプを送信しました'); if (S.view === S.sr) ding(); break;
    case 'wait': await sleep(st.ms); break;
    case 'toast': await sleep(st.delay ?? 900); appToast(st); break;
    case 'bg': { await sleep(st.delay ?? 700); const t = fmt(st.text); post(st.room, st.who, bubble(t), t); break; }
    case 'unsend': {
      const t = fmt(st.text); await sleep(typingDelay(t));
      const row = post(S.sr, st.who, bubble(t), t); if (S.view === S.sr) ding();
      await later(1700);
      const p = document.createElement('div'); p.className = 'pill'; p.textContent = `${C[st.who].n}が送信を取り消しました`;
      row.replaceWith(p); R[S.sr].last = p.textContent; R[S.sr].lastSender = null; updateBadges(); break;
    }
    case 'kick': { await sleep(1200); postPill(st.room, fmt(st.text)); R[st.room].closed = true; R[st.room].count--; if (S.view === st.room) openRoom(st.room); break; }
    case 'input': { const cat = await waitInput(st); await run(st.branches[cat] || st.branches.default || []); break; }
    case 'fn': { const r = st.f(S); if (Array.isArray(r)) await run(r); break; }
    case 'scene': $('app').style.setProperty('--chat-bg', SCENES[st.i]); $('app').classList.toggle('dark', st.i >= 3); S.interject = st.interject; break;
    case 'blackout': await doBlackout(st.text); break;
  }
}

/* ---- player input ---- */
let collect = null;
function waitInput(st){
  const room = st.room || S.sr;
  return new Promise(res => {
    S.awaiting = {st, room, res, elapsed:0, pressured:false, texts:[]};
    if (S.view !== room) setTimeout(() => { if (S.awaiting && S.awaiting.room === room && S.view !== room) openRoom(room); }, 1600);
    else if (matchMedia('(pointer:fine)').matches) input.focus();
    S.timer = setInterval(() => {
      const a = S.awaiting; if (!a || a.texts.length || input.value.trim()) return;
      a.elapsed += S.speed > 1 ? 2 : 1;
      if (st.pressure && !a.pressured && a.elapsed >= (st.pressureAt || 20)){
        a.pressured = true; const t = fmt(st.pressure[1]); post(room, st.pressure[0], bubble(t), t); if (S.view === room) ding();
      }
      if (a.elapsed >= (st.timeout || 45)) finishInput();
    }, 1000);
  });
}
function finishInput(){
  const a = S.awaiting; if (!a) return;
  clearInterval(S.timer); clearTimeout(collect); S.awaiting = null;
  S.last = a.texts.join('\n');
  const cat = (a.st.classify || classify)(S.last);
  S.lastCat = cat; S.count[cat] = (S.count[cat] || 0) + 1;
  if (a.st.save) S[a.st.save] = S.last;
  setTimeout(() => a.res(cat), 500);
}
function send(){
  const text = input.value.trim(), id = S.view; if (!text || input.disabled || id === 'list') return;
  input.value = ''; sendBtn.disabled = true;
  const r = R[id], row = post(id, 'me', bubble(text), text);
  if (!(id === 'group' && S.left)) readReceipt(row, r.readers);
  S.log.push(text);
  if (S.awaiting && S.awaiting.room === id){
    // 連投はまとめて一つの返答として扱う
    S.awaiting.texts.push(text); clearTimeout(collect); collect = setTimeout(finishInput, 2400);
  } else if (r.auto && Math.random() < .8){
    const t = r.auto[Math.floor(Math.random() * r.auto.length)];
    setTimeout(() => post(id, r.who, bubble(t), t), rnd(2500, 5000));
  } else if (id === 'group' && S.interject.length && Date.now() - S.lastInterject > 9000 && Math.random() < .5){
    S.lastInterject = Date.now();
    const [who, t0] = S.interject[Math.floor(Math.random() * S.interject.length)], t = fmt(t0);
    setTimeout(() => { post('group', who, bubble(t), t); if (S.view === 'group') ding(); }, rnd(1500, 3000));
  }
}

/* =====================================================================
   HISTORY (トーク履歴の初期状態)
   ===================================================================== */
function seed(id, items){
  let day = '';
  for (const it of items){
    if (it[0] === 'd'){ day = it[1]; continue; }
    const [who, text, time, kind] = it, t = fmt(text);
    const inner = kind === 'stamp' ? `<div class="stamp">${t}</div>` : kind === 'img' ? text : bubble(t);
    post(id, who, inner, kind === 'stamp' ? 'スタンプを送信しました' : kind === 'img' ? '画像を送信しました' : t, {seed:true, time, day});
  }
}
