name: Animal Hunt Tests

on:
  push:
    paths:
      - 'animal-hunt/**'
      - '.github/workflows/animal-hunt.yml'
  pull_request:
    paths:
      - 'animal-hunt/**'
      - '.github/workflows/animal-hunt.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animal-hunt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: animal-hunt/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
