# Publishes the game (CPU battles, no login) to GitHub Pages.
# Enable once: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy game to GitHub Pages
on:
  push:
    branches: [claude/serene-rubin-l9bs7c]
    paths: ['arcane-beasts-tcg/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: arcane-beasts-tcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arcane-beasts-tcg/package-lock.json
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: arcane-beasts-tcg/dist
      - id: deployment
        uses: actions/deploy-pages@v4
