name: Fog Trial Tests

on:
  push:
    paths:
      - 'fog-trial/**'
      - '.github/workflows/fog-trial.yml'
  pull_request:
    paths:
      - 'fog-trial/**'
      - '.github/workflows/fog-trial.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fog-trial
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fog-trial/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
