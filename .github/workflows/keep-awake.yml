# Keeps the free Render web service from sleeping by requesting it every 10 minutes.
# GitHub only runs scheduled workflows from the default branch (main).
# Set the repository variable KEEPALIVE_URL to change the address.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the chat service
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://inachat.onrender.com/healthz' }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$URL"
