name: Build Folio

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # インストーラー (Folio-Setup-x.y.z.exe) とポータブル版 (Folio-x.y.z-portable.exe) を作る
      - name: Build Windows executables
        run: npm run dist -- --win --x64
        env:
          # コード署名は行わない (証明書を用意したら CSC_LINK / CSC_KEY_PASSWORD を設定する)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Windows
          path: release/*.exe
          if-no-files-found: error
