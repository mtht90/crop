name: Build Game

on:
  push:
    paths: [ "game/**", ".github/workflows/game.yml" ]
  pull_request:
    paths: [ "game/**", ".github/workflows/game.yml" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: star-arena
          path: game/dist
