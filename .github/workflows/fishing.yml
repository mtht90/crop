name: Fishing Game

on:
  push:
    paths: [ "fishing/**", ".github/workflows/fishing.yml" ]
  pull_request:
    paths: [ "fishing/**", ".github/workflows/fishing.yml" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fishing/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: anglers-atlas
          path: fishing/dist
