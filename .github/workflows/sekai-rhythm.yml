name: Sekai Rhythm (Windows exe)

on:
  push:
    branches: [claude/project-sekai-rhythm-game-czhbuf]
    paths: ['sekai-rhythm/**', '.github/workflows/sekai-rhythm.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sekai-rhythm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sekai-rhythm/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win portable nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: SekaiRhythm-Windows
          path: sekai-rhythm/release/*.exe
          if-no-files-found: error

      - name: Releases に置く
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sekai-rhythm-latest
          target_commitish: ${{ github.sha }}
          name: Sekai Rhythm（Windows 最新ビルド）
          prerelease: true
          body: |
            - `SekaiRhythm-*-portable.exe` … インストール不要。ダブルクリックで起動
            - `SekaiRhythm-*-setup.exe` … インストーラ版

            初回起動時に Windows の「PC を保護しました」が出たら「詳細情報」→「実行」を押してください（署名なしのため）。

            ビルド元: ${{ github.sha }}
          files: sekai-rhythm/release/*.exe
