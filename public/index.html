<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文化祭シューティング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Bungee&family=Rye&display=swap">
<style>
  :root {
    --carnival-red: #e8432f;
    --carnival-yellow: #ffc93c;
    --carnival-teal: #1e9d8b;
    --cream: #fff6e3;
    --ink: #2b1a12;
    --wood: #7a4a26;
    --p1-color: #ff3b3b;
    --p2-color: #3ba7ff;
    /* Per-stage wood-panel frame color, repainted by applyStageFrameTheme()
       in game.js on every stage change; these are just the stage-1 default. */
    --frame-color: #c9975a;
    --frame-color-dark: #8a6236;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    cursor: none;
    font-family: "Mochiy Pop One", sans-serif;
  }
  canvas {
    display: block;
  }

  /* --- Wood-plank screen frame (left/right/bottom bars + the #hud top band
     below), common to every stage; only --frame-color/--frame-color-dark
     change per stage. This solid repeating-gradient plank pattern is the
     real background (Kenney's UI Pack has no wood-panel image - it's a
     button/icon pack, not panel textures). --- */
  #frameLeft, #frameRight, #frameBottom {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    background: repeating-linear-gradient(
      180deg,
      var(--frame-color) 0px,
      var(--frame-color) 10px,
      var(--frame-color-dark) 10px,
      var(--frame-color-dark) 12px
    );
    box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.4);
    transition: background 0.4s ease;
  }
  #frameLeft {
    top: 0;
    left: 0;
    width: 34px;
    height: 100%;
    border-right: 4px solid var(--ink);
  }
  #frameRight {
    top: 0;
    right: 0;
    width: 34px;
    height: 100%;
    border-left: 4px solid var(--ink);
  }
  #frameBottom {
    left: 0;
    bottom: 0;
    width: 100%;
    height: 40px;
    background: repeating-linear-gradient(
      90deg,
      var(--frame-color) 0px,
      var(--frame-color) 10px,
      var(--frame-color-dark) 10px,
      var(--frame-color-dark) 12px
    );
    border-top: 4px solid var(--ink);
  }

  /* --- HUD: top wood-plank frame band carrying the score/time panels --- */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 92px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 46px;
    pointer-events: none;
    user-select: none;
    z-index: 6;
    background: repeating-linear-gradient(
      180deg,
      var(--frame-color) 0px,
      var(--frame-color) 10px,
      var(--frame-color-dark) 10px,
      var(--frame-color-dark) 12px
    );
    border-bottom: 4px solid var(--ink);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    transition: background 0.4s ease;
  }
  .time-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .clock-icon {
    font-size: 18px;
    line-height: 1;
  }
  .score-panel {
    background: var(--wood);
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 6px 18px;
    color: var(--cream);
    text-align: center;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  }
  .score-panel .label {
    font-size: 12px;
    letter-spacing: 0.1em;
    opacity: 0.85;
  }
  .score-panel .value {
    font-family: "Rye", "Bungee", serif;
    font-size: 28px;
    font-variant-numeric: tabular-nums;
  }
  .score-panel .combo {
    height: 12px;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--carnival-yellow);
  }
  #p1Score .value { color: var(--p1-color); }
  #p2Score .value { color: var(--p2-color); }
  #timePanel {
    background-color: var(--carnival-red);
    border-color: var(--ink);
  }
  #timePanel .label { font-family: "Rye", "Bungee", serif; font-size: 12px; }
  #timePanel .value { color: var(--carnival-yellow); }
  #timePanel .value.low { color: #fff; animation: none; }

  /* --- Score popups (hit feedback) --- */
  .score-popup {
    position: fixed;
    transform: translate(-50%, 0);
    font-family: "Rye", "Bungee", serif;
    font-size: 24px;
    pointer-events: none;
    z-index: 12;
    text-shadow: 2px 2px 0 var(--ink);
    animation: scorePopupFloat 0.9s ease-out forwards;
  }
  .score-popup.positive { color: var(--carnival-yellow); }
  .score-popup.negative { color: #ff5a5a; }
  @keyframes scorePopupFloat {
    0% { transform: translate(-50%, 0) scale(0.3); opacity: 0; }
    12% { transform: translate(-50%, -6px) scale(1.35); opacity: 1; }
    24% { transform: translate(-50%, -14px) scale(0.92); }
    38% { transform: translate(-50%, -24px) scale(1.05); }
    55% { transform: translate(-50%, -42px) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -78px) scale(0.75); opacity: 0; }
  }

  /* --- Hit flash: a soft warm-white glow centered on the hit, not a
     full-screen strobe. --flash-x/--flash-y/--flash-radius are set per-call
     from game.js (see flashScreen()). */
  #hitFlash {
    position: fixed;
    inset: 0;
    background: radial-gradient(
      circle at var(--flash-x, 50%) var(--flash-y, 50%),
      rgba(255, 238, 200, 1) 0%,
      rgba(255, 238, 200, 0) var(--flash-radius, 40%)
    );
    opacity: 0;
    pointer-events: none;
    z-index: 16;
  }

  /* --- Corner combo-milestone pop --- */
  .combo-pop {
    position: fixed;
    top: 90px;
    z-index: 13;
    font-family: "Rye", "Bungee", serif;
    font-size: 22px;
    text-shadow: 2px 2px 0 var(--ink);
    opacity: 0;
    transform: scale(0.5);
    pointer-events: none;
  }
  .combo-pop.p1 { left: 16px; color: var(--p1-color); }
  .combo-pop.p2 { right: 16px; text-align: right; color: var(--p2-color); }
  .combo-pop.show { animation: comboPopBounce 1s ease-out; }
  @keyframes comboPopBounce {
    0% { opacity: 0; transform: scale(0.3) translateY(6px); }
    15% { opacity: 1; transform: scale(1.25) translateY(0); }
    30% { transform: scale(1) translateY(0); }
    75% { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(0.9) translateY(-6px); }
  }

  /* --- Score panel pop (synced to the stage-clear fanfare) --- */
  .score-panel.panel-pop {
    animation: panelPopEmphasis 0.5s ease-out;
  }
  @keyframes panelPopEmphasis {
    0% { transform: scale(1); }
    30% { transform: scale(1.18); }
    55% { transform: scale(0.96); }
    100% { transform: scale(1); }
  }

  /* --- Crosshairs (created dynamically per player) --- */
  .crosshair {
    position: fixed;
    width: 30px;
    height: 30px;
    margin-left: -15px;
    margin-top: -15px;
    pointer-events: none;
    z-index: 8;
  }
  .crosshair::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px solid var(--color, #fff);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--color, #fff);
  }
  .crosshair::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin: -2px 0 0 -2px;
    background: var(--color, #fff);
    border-radius: 50%;
  }
  /* Swapped in via JS once ASSETS.crosshair (game.js) is confirmed
     loadable; until then the CSS-drawn circle+dot above stays as-is. */
  .crosshair.has-image::before,
  .crosshair.has-image::after {
    border: none;
    box-shadow: none;
    background: none;
  }
  .crosshair.has-image::before {
    background: center / contain no-repeat;
    background-image: var(--crosshair-image);
    filter: drop-shadow(0 0 3px var(--color, #fff));
  }
  .crosshair .tag {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--color, #fff);
    font-family: "Rye", "Bungee", sans-serif;
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
  }

  /* --- Waiting-for-controller screen --- */
  #waiting {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(20, 12, 6, 0.92);
    color: var(--cream);
    text-align: center;
    z-index: 15;
    pointer-events: none; /* let fire/aim through to the canvas underneath */
  }
  #waiting h1 {
    font-size: 34px;
    margin: 0;
    color: var(--carnival-yellow);
    text-shadow: 3px 3px 0 var(--ink);
  }
  #waiting p {
    margin: 0;
    font-family: sans-serif;
    font-size: 15px;
    opacity: 0.85;
  }
  #qrHolder {
    background: var(--cream);
    padding: 12px;
    border-radius: 12px;
    border: 4px solid var(--wood);
  }
  #playerStatus {
    display: flex;
    gap: 12px;
  }
  #playerStatus .slot {
    padding: 6px 16px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    font-size: 13px;
    opacity: 0.5;
  }
  #playerStatus .slot.online {
    opacity: 1;
  }
  #p1Slot { color: var(--p1-color); border-color: var(--p1-color); }
  #p2Slot { color: var(--p2-color); border-color: var(--p2-color); }

  /* --- Result screen --- */
  #result {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(20, 12, 6, 0.85);
    color: var(--cream);
    text-align: center;
    z-index: 20;
    pointer-events: none; /* let fire/aim through to the canvas underneath */
  }
  #result h1 {
    font-family: "Rye", "Bungee", serif;
    font-size: 46px;
    margin: 0 0 12px;
    color: var(--carnival-yellow);
    text-shadow: 3px 3px 0 var(--ink);
  }
  #result .scores {
    display: flex;
    gap: 24px;
    margin: 8px 0 18px;
  }
  #result .scores .value {
    font-family: "Rye", "Bungee", serif;
    font-size: 24px;
  }
  #result #finalP1 .value { color: var(--p1-color); }
  #result #finalP2 .value { color: var(--p2-color); }
  #result p.hint {
    font-family: sans-serif;
    font-size: 16px;
    opacity: 0.8;
  }
  #result #winnerLine {
    font-family: "Rye", "Bungee", serif;
    font-size: 22px;
    color: var(--carnival-yellow);
    margin: 0;
  }
  #ranking {
    background: var(--wood);
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 10px 20px;
    margin: 10px 0;
    max-height: 32vh;
    overflow-y: auto;
    pointer-events: auto; /* scrollable even though #result lets clicks pass through */
  }
  #ranking .label {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--carnival-yellow);
    margin-bottom: 6px;
  }
  #rankingList {
    list-style: decimal;
    margin: 0;
    padding-left: 20px;
    text-align: left;
    font-family: sans-serif;
    font-size: 13px;
    line-height: 1.6;
  }

  /* --- Event banner: trigger / chain bonus / bonus stage / last bonus --- */
  #eventBanner {
    position: fixed;
    top: 36%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    font-family: "Rye", "Bungee", serif;
    font-size: 56px;
    color: var(--carnival-yellow);
    text-shadow: 4px 4px 0 var(--ink), 0 0 24px rgba(255, 201, 60, 0.7);
    z-index: 14;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
  #eventBanner.show {
    animation: eventBannerPulse 1.6s ease-out;
  }
  @keyframes eventBannerPulse {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    28% { transform: translate(-50%, -50%) scale(1); }
    78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>
  <div id="frameLeft"></div>
  <div id="frameRight"></div>
  <div id="frameBottom"></div>

  <div id="hud">
    <div class="score-panel" id="p1Score">
      <div class="label">PLAYER 1</div>
      <div class="value" id="p1ScoreValue">0</div>
      <div class="combo" id="p1Combo"></div>
    </div>
    <div class="score-panel" id="timePanel">
      <div class="label" id="stageLabel">STAGE 1/3</div>
      <div class="time-row">
        <span class="clock-icon">⏱</span>
        <span class="value" id="timeValue">30</span>
      </div>
    </div>
    <div class="score-panel" id="p2Score">
      <div class="label">PLAYER 2</div>
      <div class="value" id="p2ScoreValue">0</div>
      <div class="combo" id="p2Combo"></div>
    </div>
  </div>

  <div id="eventBanner"></div>
  <div id="hitFlash"></div>
  <div id="p1ComboPop" class="combo-pop p1"></div>
  <div id="p2ComboPop" class="combo-pop p2"></div>

  <div id="waiting">
    <h1>コントローラーを<br>接続してください</h1>
    <div id="qrHolder"></div>
    <p>スマホでQRコードを読み取って<br>コントローラー画面を開いてください</p>
    <div id="playerStatus">
      <div class="slot" id="p1Slot">PLAYER 1</div>
      <div class="slot" id="p2Slot">PLAYER 2</div>
    </div>
  </div>

  <div id="result">
    <h1>GAME CLEAR!</h1>
    <p id="winnerLine">DRAW</p>
    <div class="scores">
      <div id="finalP1"><div class="label">PLAYER 1</div><div class="value">0</div></div>
      <div id="finalP2"><div class="label">PLAYER 2</div><div class="value">0</div></div>
    </div>
    <div id="ranking">
      <div class="label">RANKING TOP 10</div>
      <ol id="rankingList"></ol>
    </div>
    <p class="hint">発射でリスタート</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
